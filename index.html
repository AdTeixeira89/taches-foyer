<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<meta name="theme-color" content="#6c4cf1">
<meta name="apple-mobile-web-app-title" content="Family Play">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Family Play</title>
<style>
:root{
  --bg:#f8f9fb;--surface:#ffffff;--ink:#1d2530;--muted:#677386;--line:#e4e8ee;
  --primary:#2456c8;--on-primary:#ffffff;--tint:#eef3fd;
  --c-a:#3f8fd9;--c-b:#e0709a;--c-c:#3fa56b;--c-all:#7b8696;
  --done:#a3acb8;--late:#b4541c;--scrim:rgba(10,15,25,.4);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--surface:#1a2029;--ink:#e8ecf1;--muted:#93a0b2;--line:#2a323d;
    --primary:#7aa4ff;--on-primary:#0b1220;--tint:#1f2a40;
    --c-a:#5aa6ef;--c-b:#ee86ad;--c-c:#55bd83;--c-all:#94a0b2;
    --done:#6b7686;--late:#e0a15c;--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--surface:#1a2029;--ink:#e8ecf1;--muted:#93a0b2;--line:#2a323d;
  --primary:#7aa4ff;--on-primary:#0b1220;--tint:#1f2a40;
  --c-a:#5aa6ef;--c-b:#ee86ad;--c-c:#55bd83;--c-all:#94a0b2;
  --done:#6b7686;--late:#e0a15c;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sync{display:block;font-size:12px;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--done)}
.sync[data-m="shared"]::before{background:var(--c-c)}
.sync[data-m="local"]::before{background:var(--late)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--tint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;
  border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:550;text-align:center}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--late)}
.link{color:var(--primary);min-height:36px;padding:0 6px}

.banner{margin:0;padding:8px 14px;font-size:13px;background:var(--tint);color:var(--ink);border-bottom:1px solid var(--line)}

main{max-width:980px;margin:0 auto;padding:12px 14px 96px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-height:52px;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:550}
.tab[aria-current="page"]{color:var(--primary);box-shadow:inset 0 2px 0 var(--primary)}

/* chips */
.bar-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--primary);background:var(--tint)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--c-all));flex:none;display:inline-block}
.sep{flex:1}

/* tasks */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));margin-top:6px}
.col{padding:0 8px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.col:first-child{padding-left:0}.col:last-child{padding-right:0}
.col-h{display:flex;align-items:center;gap:6px;padding:4px 0 8px;font-weight:650}
.col-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .ct{color:var(--muted);font-weight:500;font-size:13px}
.col-h .add{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--primary);font-size:20px;line-height:1}
.col-h .add:hover{background:var(--tint)}
.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:4px;padding:3px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.st{width:34px;height:34px;flex:none;display:grid;place-items:center;margin-left:-6px}
.tt{flex:1;min-width:0;padding:7px 0;display:block}
.title{display:block;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--muted);margin-top:1px}
.tag{color:var(--primary)}
.late{color:var(--late)}
.task.done .title{color:var(--done);text-decoration:line-through}
.task.done .meta{color:var(--done)}
.assign{display:flex;gap:4px;padding-top:5px}
.dot-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--pc);color:var(--pc);font-size:12px;font-weight:650;display:grid;place-items:center;text-align:center}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.pool{margin:2px 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.pool h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}

/* champs de saisie */
@media (prefers-reduced-motion: reduce){.sheet{animation:none!important}}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-height:42px;padding:8px 11px;font-size:16px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}

/* calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg-top{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-top button{min-height:36px;padding:0 12px;color:var(--muted);text-align:center}
.seg-top button[aria-pressed="true"]{background:var(--tint);color:var(--ink);font-weight:600}
.nav{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.nav .lbl{flex:1;text-align:center;font-weight:650;text-transform:capitalize}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{min-height:52px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface)}
.day .n{font-size:13px;min-width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.out{background:transparent;color:var(--muted)}
.day.today .n{background:var(--primary);color:var(--on-primary)}
.day.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.sec-h{margin:14px 0 4px;font-size:13px;font-weight:650;color:var(--muted);text-transform:capitalize}
.ev{display:flex;gap:10px;width:100%;padding:6px 0;align-items:stretch}
.ev .bar{width:4px;border-radius:2px;background:var(--pc);flex:none}
.ev-main{min-width:0;display:block}
.ev-title{display:block;overflow-wrap:anywhere}
.upnext{margin:0 0 6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.upnext h3{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.week-day{border-top:1px solid var(--line);padding:6px 0}
.week-day:first-child{border-top:0}
.week-day .dh{font-weight:600;text-transform:capitalize}
.week-day .dh.today{color:var(--primary)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:640px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:440px;border-radius:14px;animation:none}
}
.sheet h2{margin:0 0 14px;font-size:17px}
.fld{display:block;margin-bottom:14px}
.fld>span,.fld>.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt>span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.opt input:checked+span{border-color:var(--primary);background:var(--tint)}
.opt input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .primary{flex:1}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:20px;height:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;
  display:flex;align-items:center;gap:12px;max-width:92%;padding:10px 14px;border-radius:10px;
  background:var(--ink);color:var(--bg);font-size:14px}
.toast button{color:var(--bg);font-weight:650;text-decoration:underline;min-height:28px}

@media (max-width:420px){
  main{padding:10px 10px 96px}
  .col{padding:0 5px}
  .task .title{font-size:14px}
  .btn{padding:0 12px}
}

/* jeu */
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--primary)}
.card-h h2{margin:0;font-size:15px;font-weight:650;color:var(--ink)}
.card-h .muted{margin-left:auto}
.big{font-size:16px;font-weight:600;margin:2px 0 6px;overflow-wrap:anywhere}
.lb{display:grid;grid-template-columns:auto minmax(64px,120px) 1fr auto;gap:8px;align-items:center;padding:4px 0}
.lb-n{display:inline-flex;gap:4px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trophy{color:var(--primary);display:inline-flex}
.lb-bar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.lb-bar b{display:block;height:100%;border-radius:4px;transition:width .4s}
.lb-p{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:10px;border-radius:5px;background:var(--tint);overflow:hidden;margin:6px 0}
.prog b{display:block;height:100%;background:var(--primary);border-radius:5px;transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;text-align:center;font-size:11.5px;line-height:1.2;color:var(--done);border:1px dashed var(--line)}
.badge.on{color:var(--pc);border-style:solid;border-color:var(--pc);background:var(--tint)}
.fun-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.jk:first-child{border-top:0}
.pact{margin-bottom:6px}
.chip.wrap{text-align:left;height:auto;min-height:34px;padding:6px 11px}
.pts{color:var(--muted)}
.pop{position:fixed;left:50%;top:calc(12% + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;width:min(320px,90%);padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,20,40,.22);text-align:center}
.pop.in{animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.chk{width:56px;height:56px}
.chk circle{fill:none;stroke:var(--c-c);stroke-width:3}
.chk path{fill:none;stroke:var(--c-c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pop.in .chk circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .5s .05s forwards}
.pop.in .chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .3s .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pts-big{font-size:22px;font-weight:700;color:var(--primary)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.wheel-wrap{position:relative;width:240px;height:252px;margin:0 auto 6px;padding-top:12px}
.wheel-ptr{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--ink);z-index:2}
.champ{text-align:center;padding:4px 0 12px;color:var(--primary)}
.champ p{color:var(--ink);margin:6px 0}
.champ p.muted{color:var(--muted)}
.hrow{padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
@media (prefers-reduced-motion: reduce){.pop.in,.pop.in .chk circle,.pop.in .chk path{animation:none!important;stroke-dashoffset:0}.prog b,.lb-bar b{transition:none}}

/* ===== refonte : identité visuelle jeu familial ===== */
:root{
  --bg:#f6f5fd;--surface:#ffffff;--ink:#1e1b3a;--muted:#6b6a86;--line:#e8e6f5;
  --brand:#6c4cf1;--primary:#6c4cf1;--on-primary:#ffffff;--tint:#efecff;
  --c-a:#3d7bff;--c-b:#ff6f61;--c-c:#18bfae;--c-all:#8b86a8;
  --gold:#ffc83d;--done:#a9a6c0;--late:#d9482b;--scrim:rgba(20,15,50,.45);
  --grad:linear-gradient(135deg,#6c4cf1 0%,#3d7bff 100%);
  --shadow:0 6px 18px rgba(70,50,150,.10);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14122a;--surface:#1f1c3b;--ink:#f1efff;--muted:#a9a6cc;--line:#302c58;
    --brand:#9a85ff;--primary:#9a85ff;--on-primary:#120c2e;--tint:#2a2554;
    --c-a:#6a9bff;--c-b:#ff8a7c;--c-c:#3fd6c4;--c-all:#a29dc4;
    --done:#6f6a99;--late:#ff8d6e;--scrim:rgba(0,0,0,.6);
    --grad:linear-gradient(135deg,#7a5cff 0%,#3d7bff 100%);--shadow:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14122a;--surface:#1f1c3b;--ink:#f1efff;--muted:#a9a6cc;--line:#302c58;
  --brand:#9a85ff;--primary:#9a85ff;--on-primary:#120c2e;--tint:#2a2554;
  --c-a:#6a9bff;--c-b:#ff8a7c;--c-c:#3fd6c4;--c-all:#a29dc4;
  --done:#6f6a99;--late:#ff8d6e;--scrim:rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#7a5cff 0%,#3d7bff 100%);--shadow:0 6px 18px rgba(0,0,0,.35);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 38% at 95% 0%,rgba(108,76,241,.13),transparent 70%),radial-gradient(50% 32% at 0% 18%,rgba(24,191,174,.11),transparent 70%)}
h1,h2,h3{font-family:var(--font)}

/* en-tête */
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:0;padding:10px 14px;gap:10px;min-height:62px}
.logo{width:42px;height:42px;display:block;flex:none;filter:drop-shadow(0 4px 8px rgba(108,76,241,.35))}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.me-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--tint)}
.btn{min-height:46px;border-radius:16px;font-weight:700;padding:0 18px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(108,76,241,.32)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn:active{transform:translateY(1px)}
.link{color:var(--brand);font-weight:700;min-height:40px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;gap:8px}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--brand);color:var(--ink)}
.banner{background:var(--tint);border-radius:0}
.banner a,.banner .link{color:var(--brand);font-weight:800;white-space:nowrap}
.banner .link{min-height:32px;padding:0 4px;text-decoration:underline}
main{padding:14px 14px 110px;max-width:1080px}

/* navigation */
.tabs{background:var(--surface);border-top:0;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(70,50,150,.12);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
.nav-i{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:16px;color:var(--muted);font-size:11.5px;font-weight:700;text-align:center}
.nav-i[aria-current="page"],.nav-i.on{color:var(--brand);background:var(--tint)}
.nav-i[data-v="wheel"] svg{color:var(--c-b)}
.side{display:none}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu-i{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:18px;font-weight:700;text-align:center;color:var(--brand);background:var(--surface)}
.menu-i span{color:var(--ink);font-size:13.5px}
.menu-i.on{border-color:var(--brand);background:var(--tint)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:calc(62px + env(safe-area-inset-top,0px));bottom:0;width:224px;padding:14px 12px;z-index:4}
  .side-i{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:16px;font-weight:700;color:var(--muted)}
  .side-i[aria-current="page"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
  .side-i:hover{background:var(--tint)}
  main{margin-left:232px;max-width:none;padding-right:28px;padding-bottom:40px}
  main>section{max-width:1040px}
  .toast{bottom:24px}
}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--brand)}
.card-h h2{margin:0;font-size:16.5px;font-weight:800;color:var(--ink)}
.card-h .muted{margin-left:auto}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.big{font-size:17px;font-weight:800;margin:2px 0 6px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--tint);color:var(--brand);white-space:nowrap}
.pill.pts{background:#fff3cf;color:#8a5b00}
.pill.late{background:#ffe3dc;color:var(--late)}
.pill.doing{background:var(--tint);color:var(--brand)}
.pill.okp{background:#d9f7f2;color:#0b7d71}
.pill.glass{background:rgba(255,255,255,.22);color:#fff}
:root:not([data-theme="light"]) .pill.pts{--x:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.pts{background:#4a3a10;color:#ffd36a}:root:not([data-theme="light"]) .pill.late{background:#4a2218}:root:not([data-theme="light"]) .pill.okp{background:#0f3b36;color:#5fe0d0}}
:root[data-theme="dark"] .pill.pts{background:#4a3a10;color:#ffd36a}

/* avatars et illustrations */
.av{display:inline-block;border-radius:50%;flex:none;overflow:hidden;line-height:0;box-shadow:0 0 0 2px var(--surface)}
.av svg{width:100%;height:100%;display:block}
.art{position:relative;flex:none;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.10),0 4px 10px rgba(60,40,140,.16)}
.art .crown{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2);font-style:normal}

/* plateau de tâches */
.bar-row{gap:8px;margin-bottom:10px}
.cols{gap:18px;margin-top:8px}
.col{padding:0}.col+.col{border-left:0}.col:first-child{padding-left:0}.col:last-child{padding-right:0}
.col-h{gap:10px;padding:2px 0 10px}
.col-h .nm{font-size:16px;font-weight:800}
.col-h .ct{font-size:12.5px}
.col-h .add{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-size:24px;box-shadow:0 4px 12px rgba(108,76,241,.3)}
.col-h .add:hover{background:var(--grad);filter:brightness(1.05)}
.pool{border:2px dashed color-mix(in srgb,var(--brand) 40%,transparent);border-radius:22px;padding:12px 14px;margin:4px 0 16px;background:color-mix(in srgb,var(--tint) 55%,transparent)}
.pool h3{display:flex;gap:6px;align-items:center;color:var(--brand);font-size:15px;font-weight:800;margin:0 0 4px}
.tcard{--tc:var(--c-a);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 10px 8px 4px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--tc)}
.tier-1{--tc:#18bfae}.tier-2{--tc:#3d7bff}.tier-3{--tc:#6c4cf1}.tier-5{--tc:#ff6f61;border-color:color-mix(in srgb,#ffc83d 60%,var(--line))}
.tier-5{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,#ffc83d 12%,var(--surface)))}
.tcard .st{width:46px;height:46px;flex:none;display:grid;place-items:center;margin:0 0 0 2px}
.tmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:4px 0;text-align:left}
.tbody{min-width:0;display:block}
.tcard .title{font-weight:800;font-size:15.5px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tcard.s-done{opacity:.72}
.tcard.s-done .art{filter:grayscale(.7)}
.tcard.s-done .title{text-decoration:line-through;color:var(--muted)}
.assign{display:flex;gap:4px;flex:none}
.av-btn{border-radius:50%;line-height:0;padding:2px}
@media (max-width:520px){.tcard{flex-wrap:wrap}.tcard .assign{width:100%;justify-content:flex-end;gap:8px;padding:0 0 2px}}
.empty{color:var(--muted);font-size:13.5px;padding:10px 4px;text-align:center;border:1px dashed var(--line);border-radius:16px}
@media (max-width:720px){.cols{grid-template-columns:1fr!important}}

/* accueil */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;background:var(--grad);color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 12px 28px rgba(108,76,241,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .av{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.hello{margin:0;font-size:14px;opacity:.9;font-weight:700}
.hero h1{margin:0;font-size:25px;font-weight:800;line-height:1.1}
.pills{margin:6px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.hero-pts{text-align:center;position:relative;z-index:1}
.hero-pts b{display:block;font-size:30px;line-height:1;font-weight:800}
.hero-pts span{font-size:12px;opacity:.9;font-weight:700}
.xp{grid-column:1/-1;margin-top:10px;position:relative;z-index:1}
.xp p{margin:6px 0 0;font-size:12.5px;opacity:.95;font-weight:700}
.xpbar{height:12px;border-radius:8px;background:rgba(120,110,170,.18);overflow:hidden}
.xpbar b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffc83d,#ff9a3d);transition:width .6s}
.hero .xpbar{background:rgba(255,255,255,.28)}
.home-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:760px){.home-grid{grid-template-columns:1fr 1fr;align-items:start}}
.prog{height:12px;border-radius:8px;background:var(--tint);overflow:hidden;margin:6px 0 12px}
.prog b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c-c),var(--brand));transition:width .6s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;background:var(--tint);text-align:center}
.tile b{font-size:22px;line-height:1;font-weight:800}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile.t-wheel{background:linear-gradient(135deg,color-mix(in srgb,var(--c-b) 22%,var(--surface)),color-mix(in srgb,var(--gold) 26%,var(--surface)))}
.mini-lb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:6px}
.mini-lb div{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini-lb b{font-size:20px;font-weight:800;color:var(--pc)}
.mini-lb span{font-size:12px;color:var(--muted);font-weight:700}
.goal{display:flex;gap:14px;align-items:center}.goal-b{flex:1;min-width:0}

/* classement et famille */
.lb{display:grid;grid-template-columns:auto minmax(60px,110px) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.lb-n{display:inline-flex;gap:6px;align-items:center;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trophy{color:var(--gold);display:inline-flex;margin-left:4px}
.lb-bar{height:12px;border-radius:8px;background:var(--tint);overflow:hidden}
.lb-bar b{display:block;height:100%;border-radius:8px;background:var(--pc);transition:width .5s}
.lb-p{font-weight:800;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media (min-width:760px){.pgrid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
.pcard{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.pc-b{flex:1;min-width:0}.pc-b h3{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px}
.mini-badges{display:flex;gap:6px}
.mb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--done)}
.mb.on{background:var(--grad);color:#fff}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;text-align:center;font-size:12px;font-weight:700;line-height:1.2;color:var(--muted)}
.badge.on{color:var(--ink)}
.feed{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.feed:first-child{border-top:0}
.feed-t{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.fun-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* bonus */
.ticketline{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ticket-card{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),color-mix(in srgb,var(--c-c) 14%,var(--surface)))}
.bcard{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.bc-b{flex:1;min-width:0}
.bc-b h3{margin:0;font-size:15.5px;font-weight:800;overflow-wrap:anywhere}
.bc-b p{margin:2px 0 0;font-size:13.5px}
.bc-b p.muted{font-size:12.5px}
.by{display:flex;align-items:center;gap:6px;font-size:12.5px!important;font-weight:700;color:var(--muted)}
.bc-s{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.s-avail{background:#d9f7f2;color:#0b7d71}.s-unlocked{background:var(--tint);color:var(--brand)}.s-used{background:#ecebf3;color:#7a7894}.s-wait{background:#fff0cf;color:#8a5b00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .s-avail{background:#0f3b36;color:#5fe0d0}:root:not([data-theme="light"]) .s-used{background:#2a2750;color:#a9a6cc}:root:not([data-theme="light"]) .s-wait{background:#4a3a10;color:#ffd36a}}
:root[data-theme="dark"] .s-avail{background:#0f3b36;color:#5fe0d0}:root[data-theme="dark"] .s-used{background:#2a2750;color:#a9a6cc}:root[data-theme="dark"] .s-wait{background:#4a3a10;color:#ffd36a}
@media (max-width:420px){.bcard{flex-wrap:wrap}.bc-s{flex-direction:row;align-items:center;width:100%;justify-content:space-between}}
.jk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.jk:first-child{border-top:0}

/* roulette */
.wheel-card{text-align:center}
.wheel-card .card-h,.wheel-card .ticketline{text-align:left}
.wheel-stage{position:relative;width:min(340px,88vw);margin:10px auto 4px}
.wheel-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(70,50,150,.28))}
.wheel-ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--gold);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;text-align:center;box-shadow:0 4px 12px rgba(108,76,241,.4);z-index:2}
.hub:disabled{background:#b9b6d3;box-shadow:none}
.btn.spin{width:100%;max-width:340px;min-height:56px;font-size:17px;margin-top:8px}
.result{text-align:center;padding:6px 0 14px}
.result .burst{display:inline-block;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.result .art{border-radius:30px}
.result .kicker{margin:12px 0 0;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.result h3{margin:4px 0 6px;font-size:22px;font-weight:800}
.r-joker .kicker{color:var(--c-a)}.r-activite .kicker{color:var(--c-c)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* fenêtres */
.sheet{border-radius:28px 28px 0 0;font-family:var(--font)}
@media (min-width:640px){.sheet{border-radius:26px}}
.sheet h2{font-size:19px;font-weight:800}
.opt>span{border-radius:999px;min-height:44px;font-weight:700}
.opt input:checked+span{border-color:var(--brand);background:var(--tint)}
input[type=text],input[type=date],input[type=time],textarea{border-radius:14px;min-height:46px}
.pop{border-radius:24px;box-shadow:0 18px 40px rgba(60,40,140,.3)}
.pts-big{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px;font-weight:800}
.pop .xpbar{margin:10px 6px 0}
.toast{border-radius:16px;font-weight:700}

/* calendrier : mêmes codes visuels */
.day{border-radius:0;background:var(--surface)}
.day.today .n{background:var(--grad)}
.upnext{border-radius:18px}
.seg-top{border-radius:14px}
@media (prefers-reduced-motion: reduce){.result .burst{animation:none}.xpbar b,.prog b,.lb-bar b{transition:none}}

/* finitions */
.brand{min-width:0}
.brand b{white-space:nowrap}
@media (max-width:340px){.top{padding:10px;gap:6px}.brand b{font-size:16px}#btnNewTask{padding:0 12px}}
.sync{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h{flex-wrap:wrap}
.card>.btn:not(.small){width:100%}
.card>.fun-actions>.btn{flex:0 0 auto}
@media (max-width:520px){
  .chip{min-height:36px;padding:0 11px;font-size:13px;gap:6px}
  .bar-row{gap:6px;margin-bottom:8px}
  .card{padding:14px;border-radius:20px}
}
@media (min-width:900px){.banner{margin-left:224px}}

<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const fmtShort = new Intl.DateTimeFormat('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const fmtDayLong = new Intl.DateTimeFormat('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const fmtMonth = new Intl.DateTimeFormat('fr-FR', {month:'long', year:'numeric'});
const fmtDM = new Intl.DateTimeFormat('fr-FR', {day:'numeric', month:'short'});
function relDate(s){
  if (!s) return '';
  const t = todayStr();
  if (s === t) return "Aujourd'hui";
  if (s === ymd(addDays(new Date(), 1))) return 'Demain';
  return fmtShort.format(parseYmd(s));
}
function validDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }

/* ---------- préférences d'affichage (par appareil) ---------- */
const PREF_KEY = 'famille.prefs.v1';
let ui = {view:'home', meSet:false, hiddenCols:{}, hideDone:true, status:'all', calMode:'month', me:'a', fx:{anim:true, sound:false}, celebrated:{}, missionShift:{}};
try { const raw = localStorage.getItem(PREF_KEY); if (raw) ui = Object.assign(ui, JSON.parse(raw)); } catch(e) {}
ui.fx = Object.assign({anim:true, sound:false}, ui.fx || {}); ui.celebrated = ui.celebrated || {}; ui.missionShift = ui.missionShift || {};
function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify(ui)); } catch(e) {} }

/* ---------- état ---------- */
const PEOPLE = ['a','b','c'];
const COLORS = {a:'var(--c-a)', b:'var(--c-b)', c:'var(--c-c)', all:'var(--c-all)'};
const STATUS = {todo:'À faire', doing:'En cours', done:'Fait'};
const NEXT = {todo:'doing', doing:'done', done:'todo'};
// 'ideas' : section retirée de l'interface, mais la collection est conservée (rien n'est effacé)
const COLS = ['tasks','ideas','events','points','weeks','pacts','jokers','spins','missions'];
/* page publiée sur claude.ai : seule version où les données sont communes à toute la famille */
const SHARED_URL = 'https://claude.ai/artifact/XyDceVrGTqUB2qQG4faGsM';

function mergeSettings(d){
  const n = (d && d.names) || {};
  return {
    names: {a: n.a || 'Adao', b: n.b || 'Maman', c: n.c || 'Fille'},
    daughterOn: d && typeof d.daughterOn === 'boolean' ? d.daughterOn : true,
    goal: d && Number(d.goal) > 0 ? Number(d.goal) : 20,
    collReward: (d && d.collReward) || 'Soirée pizza',
    avatars: {a: (d && d.avatars && d.avatars.a) || 'fox', b: (d && d.avatars && d.avatars.b) || 'owl', c: (d && d.avatars && d.avatars.c) || 'rabbit'}
  };
}
const state = {
  tasks:[], ideas:[], events:[], points:[], weeks:[], pacts:[], jokers:[], spins:[], missions:[],
  settings: mergeSettings(null), loaded:{},
  mode:'connecting', canWrite:true
};
const cal = {anchor:new Date(), sel:todayStr(), showPast:false};

const pname = k => k === 'all' ? 'Toute la famille' : (state.settings.names[k] || '');
const initial = k => (pname(k).trim()[0] || '?').toUpperCase();
const activePeople = () => state.settings.daughterOn ? PEOPLE.slice() : ['a','b'];

/* ---------- base familiale hors claude.ai (GitHub Pages) : Firebase ---------- */
// Configuration web du projet Firebase (console Firebase > Paramètres du projet > Vos applications).

const FAMILY_KEY = 'famille.firebase.code';

const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtCode = c => c.replace(/(.{4})(?=.)/g, '$1-');
function newFamilyCode(){ const a = new Uint32Array(12); crypto.getRandomValues(a); return Array.from(a, n => CODE_ABC[n % CODE_ABC.length]).join(''); }
function getFamilyCode(){ try { return localStorage.getItem(FAMILY_KEY) || ''; } catch(e) { return ''; } }
function setFamilyCode(c){ try { localStorage.setItem(FAMILY_KEY, c); } catch(e) {} }
function isNewFamily(c){ try { return localStorage.getItem(NEW_FAMILY_KEY) === c; } catch(e) { return false; } }
let fbBase = null;
function firebaseBase(){
  if (!fbBase) fbBase = (async () => {
    const [appM, authM, fsM] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authM.signInAnonymously(auth);
    return {fsM, fs: fsM.initializeFirestore(app, {ignoreUndefinedProperties: true})};
  })();
  return fbBase;
}
// même interface que la base de claude.ai, rangée sous foyers/<code famille>/
async function firebaseDb(code){
  const {fsM, fs} = await firebaseBase();
  const snapDoc = s => ({id: s.id, exists: s.exists(), data: () => s.data()});
  const docApi = ref => ({
    get: async () => snapDoc(await fsM.getDoc(ref)),
    set: d => fsM.setDoc(ref, d),
    update: d => fsM.updateDoc(ref, d),
    delete: () => fsM.deleteDoc(ref),
    onSnapshot: (next, err) => fsM.onSnapshot(ref, s => next(snapDoc(s)), err)
  });
  return {
    collection: c => ({
      doc: id => docApi(fsM.doc(fs, 'foyers', code, c, id)),
      onSnapshot: (next, err) => fsM.onSnapshot(fsM.collection(fs, 'foyers', code, c), s => next({docs: s.docs.map(snapDoc)}), err)
    }),
    doc: path => docApi(fsM.doc(fs, 'foyers', code, ...path.split('/')))
  };
}

/* ---------- stockage : base partagée (db) ou repli local ---------- */
const store = {
  db: null,
  backend: '',
  async init(){
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e) { db = null; }
    if (db) {
      this.db = db;
      state.mode = 'shared';
      try {
        const user = await window.claude.use('user');
        if (user) { const cw = await user.can('data.write'); if (cw === false) state.canWrite = false; }
      } catch(e) {}
      this.listen(db);
    } else if (FIREBASE_CONFIG) {
      this.backend = 'firebase';
      const code = getFamilyCode();
      if (!code) { state.mode = 'nofamily'; state.canWrite = false; renderAll(); familySheet(); return; }
      try { db = await firebaseDb(code); }
      catch(e) { console.error(e); state.mode = 'error'; state.canWrite = false; renderAll(); return; }
      this.db = db;
      state.mode = 'shared';
      this.listen(db);
      if (isNewFamily(code)) {
        try { await this.seedNewFamily(); try { localStorage.removeItem(NEW_FAMILY_KEY); } catch(e) {} }
        catch(e) { console.error(e); toast('Le foyer est créé, mais les données de cet appareil n’ont pas toutes été copiées.'); }
      }
    } else {
      state.mode = 'local';
      COLS.forEach(c => { try { state[c] = JSON.parse(localStorage.getItem('famille.local.' + c) || '[]'); } catch(e) { state[c] = []; } state.loaded[c] = true; });
      try { state.settings = mergeSettings(JSON.parse(localStorage.getItem('famille.local.settings') || 'null')); } catch(e) {}
    }
    renderAll();
    if (!ui.meSet) setTimeout(() => { if (!sheet) profileSheet(); }, 500);
  },
  listen(db){
    COLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        state[c] = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
        state.loaded[c] = true;
        renderAll();
      }, onDbError);
    });
    db.doc('settings/family').onSnapshot(snap => {
      state.settings = mergeSettings(snap.exists ? snap.data() : null);
      renderAll();
    }, onDbError);
  },
  // nouveau foyer : on y recopie ce qui avait été saisi en mode local sur cet appareil (rien n'est effacé)
  async seedNewFamily(){
    let local = null;
    try { local = JSON.parse(localStorage.getItem('famille.local.settings') || 'null'); } catch(e) {}
    await this.db.doc('settings/family').set(mergeSettings(local));
    for (const c of COLS) {
      let rows = [];
      try { rows = JSON.parse(localStorage.getItem('famille.local.' + c) || '[]'); } catch(e) {}
      for (const r of rows) if (r && r.id) await this.db.collection(c).doc(String(r.id)).set(strip(r));
    }
  },
  localSave(c){ try { localStorage.setItem('famille.local.' + c, JSON.stringify(state[c])); } catch(e) {} },
  async set(col, id, data){
    if (this.db) return this.db.collection(col).doc(id).set(data);
    const i = state[col].findIndex(x => x.id === id);
    const obj = Object.assign({id}, data);
    if (i >= 0) state[col][i] = obj; else state[col].push(obj);
    this.localSave(col); renderAll();
  },
  async update(col, id, fields){
    if (this.db) return this.db.collection(col).doc(id).update(fields);
    const i = state[col].findIndex(x => x.id === id);
    if (i >= 0) state[col][i] = Object.assign({}, state[col][i], fields);
    this.localSave(col); renderAll();
  },
  async remove(col, id){
    if (this.db) return this.db.collection(col).doc(id).delete();
    state[col] = state[col].filter(x => x.id !== id);
    this.localSave(col); renderAll();
  },
  async saveSettings(s){
    if (this.db) return this.db.doc('settings/family').set(s);
    state.settings = mergeSettings(s);
    try { localStorage.setItem('famille.local.settings', JSON.stringify(s)); } catch(e) {}
    renderAll();
  }
};
function onDbError(err){
  if (err && err.code === 'revoked') { state.mode = 'revoked'; state.canWrite = false; renderAll(); }
  else if (store.backend === 'firebase') { console.error(err); state.mode = 'error'; state.canWrite = false; renderAll(); }
  else { console.error(err); }
}
async function run(fn){
  if (!state.canWrite) { toast(state.mode === 'nofamily' ? 'Choisis d’abord ton foyer.' : state.mode === 'error' ? 'Base familiale injoignable : rien n’a été enregistré.' : 'Lecture seule : ton accès ne permet pas de modifier.'); return false; }
  try { await fn(); return true; }
  catch(e) { console.error(e); toast('Modification non enregistrée. Réessaie.'); return false; }
}
function strip(o){ const c = Object.assign({}, o); delete c.id; return c; }

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-action="undo">Annuler</button>' : '');
  t.hidden = false;
  toast.undo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toast.undo = null; }, undo ? 6000 : 3200);
}

let sheet = null, lastFocus = null;
function openSheet(title, body, onSubmit, extra){
  closeSheet();
  lastFocus = document.activeElement;
  const root = $('#sheetRoot');
  root.innerHTML = '<div class="scrim" data-action="closeSheet"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><form id="sheetForm" novalidate>' +
    '<h2>' + esc(title) + '</h2>' + body + '</form></div>';
  sheet = Object.assign({onSubmit}, extra || {});
  const form = $('#sheetForm');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const ok = await onSubmit(form);
    if (ok !== false && ok !== 'keep') closeSheet();
  });
  const first = $('input[type=text],textarea', form);
  if (first) { first.focus(); try { first.setSelectionRange(first.value.length, first.value.length); } catch(e) {} }
}
function closeSheet(){
  $('#sheetRoot').innerHTML = '';
  sheet = null;
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch(e) {} }
  lastFocus = null;
}
function radios(name, options, value){
  return '<div class="seg" role="radiogroup">' + options.map(o =>
    '<label class="opt"><input type="radio" name="' + name + '" value="' + esc(o[0]) + '"' + (o[0] === value ? ' checked' : '') + '>' +
    '<span>' + (o[2] ? '<i class="dot" style="--pc:' + o[2] + '"></i>' : '') + esc(o[1]) + '</span></label>').join('') + '</div>';
}
const val = (f, n) => { const el = f.elements[n]; return el ? (el.value || '').trim() : ''; };
const radio = (f, n) => { const el = f.querySelector('input[name="' + n + '"]:checked'); return el ? el.value : ''; };

/* ---------- tâches ---------- */
function taskSheet(t, preOwner){
  const isNew = !t;
  t = t || {title:'', owner: preOwner || '', status:'todo', due:'', pts:2};
  const owners = [['', 'Personne', 'var(--done)']].concat(activePeople().map(p => [p, pname(p), COLORS[p]]));
  const body =
    '<label class="fld"><span>Tâche</span><input type="text" name="title" maxlength="140" autocomplete="off" enterkeyhint="done" value="' + esc(t.title) + '" placeholder="Ex. Appeler l\'école"></label>' +
    '<div class="fld"><span class="lab">Responsable</span>' + radios('owner', owners, t.owner) + '</div>' +
    '<div class="fld"><span class="lab">Difficulté (points à la fin)</span>' + radios('pts', LEVELS.map(l => [String(l[0]), l[1]]), String(Number(t.pts) || 2)) + '</div>' +
    (isNew ? '' : '<div class="fld"><span class="lab">Statut</span>' + radios('status', Object.keys(STATUS).map(k => [k, STATUS[k]]), t.status) + '</div>') +
    '<label class="fld"><span>Date limite (facultatif)</span><div class="row"><input type="date" name="due" value="' + esc(t.due) + '"><button type="button" class="link" data-action="clearDue">Effacer</button></div></label>' +
    '<div class="sheet-actions"><button type="submit" class="btn primary">Enregistrer</button>' +
    (isNew ? '' : '<button type="button" class="btn danger" data-action="sheetDelete">Supprimer</button>') + '</div>';
  openSheet(isNew ? 'Nouvelle tâche' : 'Modifier la tâche', body, async f => {
    const title = val(f, 'title');
    if (!title) { f.elements.title.focus(); return false; }
    const owner = radio(f, 'owner');
    const due = validDate(val(f, 'due')) ? val(f, 'due') : '';
    const pts = Number(radio(f, 'pts')) || 2;
    if (isNew) {
      const data = {title, owner, status:'todo', due, pts, createdAt: Date.now()};
      return run(() => store.set('tasks', uid(), data));
    }
    const status = radio(f, 'status') || t.status;
    const fields = {title, owner, pts, due};
    if (status === 'done' && t.status !== 'done') {
      const merged = Object.assign({}, t, fields);
      const saved = await run(() => store.set('tasks', t.id, Object.assign(strip(t), fields)));
      if (!saved) return false;
      closeSheet(); finishTask(merged); return 'keep';
    }
    return run(() => store.set('tasks', t.id, Object.assign(strip(t), fields, {status})));
  }, isNew ? {} : {onDelete: () => deleteWithUndo('tasks', t, 'Tâche supprimée')});
}
function deleteWithUndo(col, obj, msg){
  const copy = Object.assign({}, obj);
  run(async () => {
    await store.remove(col, obj.id);
    toast(msg, async () => { await run(() => store.set(col, copy.id, strip(copy))); });
  });
}
function taskSort(a, b){
  const da = a.status === 'done' ? 1 : 0, db = b.status === 'done' ? 1 : 0;
  if (da !== db) return da - db;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}
function statusIcon(s){

}

const TIER = {
  1: {label:'Simple', c:['#18bfae','#5fe0d0']},
  2: {label:'Normale', c:['#3d7bff','#7aa7ff']},
  3: {label:'Importante', c:['#6c4cf1','#a07bff']},
  5: {label:'Grosse corvée', c:['#ff6f61','#ffc83d']}
};
const tierOf = t => TIER[ptsOf(t)] ? ptsOf(t) : 2;
function taskGlyph(title){
  const s = String(title || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/vaisselle|assiette|couvert/.test(s)) return 'dish';
  if (/linge|lessive|repass|vetement|machine/.test(s)) return 'laundry';
  if (/poubelle|dechet|recycl|tri /.test(s)) return 'trash';
  if (/course|supermarche|achat|magasin/.test(s)) return 'cart';
  if (/menage|aspir|balai|nettoy|poussiere|serpill|salle de bain|toilette|rang|chambre|lit /.test(s)) return 'broom';
  if (/cuisin|repas|diner|dejeuner|gouter|plat/.test(s)) return 'pot';
  if (/jardin|plante|pelouse|arros|fleur|piscine/.test(s)) return 'leaf';
  if (/chien|chat|animal|promen|litiere/.test(s)) return 'paw';
  if (/devoir|ecole|lecture|livre|etud|reviser/.test(s)) return 'book';
  return 'home';
}
function statusRing(s){
  if (s === 'done') return '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="var(--c-c)"/><path d="M9 15.500l4 4 8-8.500" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  return '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12.500" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3.500"/></svg>';
}
function taskCard(t, assign){

  const late = t.due && t.due < todayStr() && s !== 'done';
  const got = s === 'done' && byId('points', t.id);
  const pills = '<span class="pill tier">' + T.label + '</span>' +
    '<span class="pill pts">' + IC.star(12) + (got ? '+' : '') + pv + ' pt' + (pv > 1 ? 's' : '') + '</span>' +
    (t.due ? '<span class="pill' + (late ? ' late' : '') + '">' + ico('cal', 12) + esc(relDate(t.due)) + '</span>' : '') +

      '<span class="tbody"><span class="title">' + esc(t.title) + '</span><span class="chips">' + pills + '</span></span></button>' + av + '</li>';

function renderTasks(){
  const people = activePeople();
  const doneCount = state.tasks.filter(t => t.status === 'done').length;
  const vis = people.filter(p => !ui.hiddenCols[p]);
  const statusOpts = [['all','Toutes'],['todo','À faire'],['doing','En cours'],['done','Faites']];
  $('#filters').innerHTML =
    '<div class="bar-row" role="group" aria-label="Colonnes affichées">' +
      people.map(p => '<button type="button" class="chip" data-action="toggleCol" data-p="' + p + '" aria-pressed="' + (!ui.hiddenCols[p]) + '">' + avatar(p, 28) + esc(pname(p)) + '</button>').join('') +
    '</div>' +
    '<div class="bar-row" role="group" aria-label="Filtrer par statut">' +
      statusOpts.map(o => '<button type="button" class="chip" data-action="statusFilter" data-s="' + o[0] + '" aria-pressed="' + (ui.status === o[0]) + '">' + o[1] + '</button>').join('') +
      '<span class="sep"></span>' +
      '<button type="button" class="chip" data-action="toggleDone" aria-pressed="' + ui.hideDone + '">' + (ui.hideDone ? 'Terminées masquées (' + doneCount + ')' : 'Masquer les terminées') + '</button>' +
    '</div>';

  const list = state.tasks.filter(t => {
    if (ui.status !== 'all' && t.status !== ui.status) return false;
    if (t.status === 'done' && ui.hideDone && ui.status !== 'done') return false;
    return true;
  }).sort(taskSort);

  const pool = list.filter(t => people.indexOf(t.owner) < 0);
  $('#pool').innerHTML = pool.length
    ? '<div class="pool"><h3>' + IC.hand(18) + 'À prendre (' + pool.length + ')</h3><p class="muted" style="margin:0 0 6px">Touche un avatar pour prendre la tâche.</p><ul class="list">' + pool.map(t => taskCard(t, true)).join('') + '</ul></div>' : '';

  const cols = $('#cols');
  cols.style.setProperty('--n', Math.max(vis.length, 1));
  if (!vis.length) { cols.innerHTML = '<p class="empty">Aucune colonne affichée. Touche un prénom ci-dessus pour la montrer.</p>'; return; }
  cols.innerHTML = vis.map(p => {
    const mine = list.filter(t => t.owner === p);
    const open = state.tasks.filter(t => t.owner === p && t.status !== 'done').length;
    return '<div class="col" style="--pc:' + COLORS[p] + '"><div class="col-h">' + avatar(p, 44) + '<span class="nm">' + esc(pname(p)) + '</span><span class="ct">' + open + ' à faire</span>' +
      '<button type="button" class="add" data-action="newTask" data-p="' + p + '" aria-label="Ajouter une tâche pour ' + esc(pname(p)) + '">+</button></div>' +
      (mine.length ? '<ul class="list">' + mine.map(t => taskCard(t, false)).join('') + '</ul>' : '<p class="empty">Rien ici pour le moment</p>') + '</div>';
  }).join('');
}

/* badges : calculés à partir de l'historique des points, donc jamais retirés */
const BADGES = [
  {id:'streak3', name:'Série de 3 jours', desc:'Des points trois jours de suite.', icon:'flame'},
  {id:'perfect', name:'Semaine parfaite', desc:'Une tâche terminée chaque jour d’une même semaine.', icon:'star'},
  {id:'team', name:'Esprit d’équipe', desc:'Prendre 3 tâches « À prendre », ou donner un coup de main.', icon:'hand'},
  {id:'comeback', name:'Retour en force', desc:'3 points ou plus en un jour après 3 jours sans point.', icon:'trophy'}
];
const dayGap = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
function badgesOf(who, extra){
  const ex = extra || [];
  const all = state.points.filter(p => !ex.some(e => e.taskId && e.taskId === p.taskId)).concat(ex).filter(p => p.who === who);
  const days = Array.from(new Set(all.map(p => p.day).filter(Boolean))).sort();
  const out = {streak3:false, perfect:false, team:false, comeback:false};
  let run3 = 1;
  for (let i = 0; i < days.length; i++) {
    if (i > 0) run3 = dayGap(days[i-1], days[i]) === 1 ? run3 + 1 : 1;
    if (run3 >= 3) out.streak3 = true;
    if (i > 0 && dayGap(days[i-1], days[i]) >= 4) {
      const sum = all.filter(p => p.day === days[i]).reduce((s, p) => s + (Number(p.pts) || 0), 0);
      if (sum >= 3) out.comeback = true;
    }
  }
  const perWeek = {};
  days.forEach(d => { const k = wkOf(d); perWeek[k] = (perWeek[k] || 0) + 1; });
  out.perfect = Object.keys(perWeek).some(k => perWeek[k] >= 7);
  const helps = state.jokers.filter(j => j.kind === 'help' && j.status === 'accepted' && j.helper === who).length;
  out.team = all.filter(p => p.pool).length >= 3 || helps >= 1;
  return out;
}
function curStreak(who){
  const days = new Set(state.points.filter(p => p.who === who).map(p => p.day));
  let d = parseYmd(todayStr());
  if (!days.has(ymd(d))) d = addDays(d, -1);
  let n = 0;
  while (days.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}

/* animations et sons (désactivables) */
const fxOn = () => ui.fx.anim && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let audioCtx = null;
function tone(seq){
  if (!ui.fx.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    seq.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n[1]);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + n[1] + 0.02);
      t += n[1] * 0.8;
    });
  } catch(e) {}
}
function confetti(){
  if (!fxOn()) return;
  const cv = $('#fx');
  if (!cv || !cv.getContext) return;
  let ctx = null;
  try { ctx = cv.getContext('2d'); } catch(e) {}
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--c-a','--c-b','--c-c','--primary'].map(v => cs.getPropertyValue(v).trim() || '#3f8fd9').concat(['#f2c14e']);
  const ps = [];
  for (let i = 0; i < 80; i++) ps.push({x: W/2 + (Math.random()-.5)*80, y: H*.3, vx: (Math.random()-.5)*9, vy: -Math.random()*9 - 3, r: Math.random()*6.28, vr: (Math.random()-.5)*.4, s: 5 + Math.random()*5, c: cols[Math.floor(Math.random()*cols.length)]});
  const t0 = performance.now();
  function tick(now){
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / 2200); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*.6); ctx.restore();
    });
    if (el < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}

/* terminer une tâche : points attribués une seule fois (identifiant du point = identifiant de la tâche) */
function setStatus(t, next){
  if (next === 'done') return finishTask(t);
  return run(() => store.update('tasks', t.id, {status: next}));
}
function finishTask(t){
  const who = t.owner && activePeople().indexOf(t.owner) >= 0 ? t.owner : '';
  if (who) return completeTask(t, who);
  askWho(t);
}
function askWho(t){
  const opts = activePeople().map(p => [p, pname(p), COLORS[p]]);
  openSheet('Qui l’a terminée ?',
    '<p class="help">« ' + esc(t.title) + ' »</p><div class="fld">' + radios('who', opts, meOf()) + '</div>' +
    '<div class="sheet-actions"><button type="submit" class="btn primary">Terminée</button></div>',
    async f => { const who = radio(f, 'who'); if (!who) return false; closeSheet(); completeTask(t, who); return 'keep'; });
}
async function completeTask(t, who){
  const wk = curWeek(), before = badgesOf(who), cBefore = countOf(wk);
  const dup = !!byId('points', t.id);
  const pts = ptsOf(t), day = todayStr();
  const lvInfo = levelInfo(who, dup ? 0 : pts), lvUp = !dup && lvInfo.level > levelInfo(who).level;
  const rec = {taskId: t.id, title: t.title, who, pts, day, week: wkOf(day), at: Date.now(), pool: !!t.tookFromPool};
  const ok = await run(async () => {
    await store.update('tasks', t.id, {status:'done', owner: who, doneAt: Date.now()});
    if (!dup) await store.set('points', t.id, rec);
  });
  if (!ok) return;
  if (dup) { toast('Terminée. Les points de cette tâche étaient déjà comptés.'); return; }
  const after = badgesOf(who, [rec]);
  const newB = BADGES.filter(b => after[b.id] && !before[b.id]);
  const goalHit = cBefore < goalOf() && cBefore + 1 >= goalOf();
  let extra = '';
  if (lvUp) extra = 'Niveau ' + lvInfo.level + ' atteint : ' + lvInfo.title + ' !';
  else if (newB.length) extra = 'Nouveau badge : ' + newB[0].name;
  else if (goalHit) extra = 'Défi de la famille atteint !';
  const big = pts >= 3 || newB.length > 0 || goalHit || lvUp;
  popDone(pts, pick(DONE_MSGS), extra, lvInfo);
  if (big) { confetti(); tone([[523,.12],[659,.12],[784,.12],[1046,.26]]); }
  else tone([[660,.12],[880,.16]]);
}

/* clôture des semaines passées : historique conservé, sans doublon (id = lundi de la semaine) */
const finalizing = new Set();
function finalizeWeeks(){
  if (!state.canWrite || !state.loaded.points || !state.loaded.weeks) return;
  const cur = curWeek();
  const wks = new Set(state.points.map(p => p.week).filter(w => w && w < cur));
  wks.forEach(wk => {
    if (byId('weeks', wk) || finalizing.has(wk)) return;
    finalizing.add(wk);
    const c = championOf(wk);
    Promise.resolve(store.set('weeks', wk, {week: wk, totals: c.t, champions: c.list, max: c.max, count: countOf(wk), goal: goalOf(), closedAt: Date.now()}))
      .catch(() => finalizing.delete(wk));
  });
}

/* champion */
function celebrateChampion(wk){
  const c = championOf(wk);
  if (!c.list.length) return;
  const total = PEOPLE.reduce((s, p) => s + c.t[p], 0);
  const msg = c.list.length > 1 ? 'Égalité parfaite : le trophée se partage !' :
    pick(['Le trophée est à toi, la maison applaudit.', 'Champion de la semaine : le lave-vaisselle tremble encore.', 'Bravo ! Les autres ont déjà commencé l’ovation.']);
  openSheet('Champion de la semaine',
    '<div class="champ">' + IC.trophy(64) + '<p class="big">' + esc(namesOf(c.list)) + '</p><p>' + esc(msg) + '</p>' +
    '<p class="muted">Merci à toute la famille : ' + total + ' points cette semaine.</p></div>' +
    '<div class="sheet-actions"><button type="submit" class="btn primary">Merci !</button></div>', async () => true);
  confetti(); tone([[523,.14],[659,.14],[784,.14],[1046,.3]]);
}
function maybeCelebrate(){
  if (['home','family','fun'].indexOf(ui.view) < 0 || sheet || !state.loaded.points) return;
  const cur = curWeek(), prev = prevWeek();
  let wk = '';
  if (new Date().getDay() === 0 && !ui.celebrated[cur] && championOf(cur).list.length) wk = cur;
  else if (!ui.celebrated[prev] && championOf(prev).list.length) wk = prev;
  if (!wk) return;
  ui.celebrated[wk] = true; savePrefs();
  setTimeout(() => { if (!sheet) celebrateChampion(wk); }, 350);
}

/* jokers : un de chaque type par personne et par semaine */
const JOKERS = {swap:'Joker corvée', choice:'Joker choix', help:'Joker coup de main'};
const jokerLive = j => j.status !== 'refused' && j.status !== 'cancelled';
function jokersLeft(who, kind){
  const wk = curWeek();
  const used = state.jokers.filter(j => j.who === who && j.week === wk && j.kind === kind && jokerLive(j)).length;
  let allow = 1;
  if (kind === 'swap') allow += state.spins.filter(s => s.who === who && s.week === wk && s.prize === 'joker').length;
  return Math.max(0, allow - used);
}
function jokerSheet(kind){
  const me = meOf(), wk = curWeek();
  const mine = state.tasks.filter(t => t.owner === me && t.status !== 'done').sort(taskSort);
  const others = activePeople().filter(p => p !== me);
  const short = t => t.title.length > 38 ? t.title.slice(0, 37) + '…' : t.title;
  let body = '', save;
  if (kind === 'choice') {
    body = '<div class="fld"><span class="lab">Tu choisis</span>' + radios('what', [['film', 'Le film'], ['repas', 'Le repas'], ['activité', 'L’activité']], 'film') + '</div>' +
      '<label class="fld"><span>Ton choix (facultatif)</span><input type="text" name="text" maxlength="100" autocomplete="off" placeholder="Ex. Un film d’aventure"></label>';
    save = f => ({kind:'choice', who: me, what: radio(f, 'what') || 'film', text: val(f, 'text'), status:'active'});
  } else {
    if (!mine.length) { toast('Tu n’as aucune tâche en cours pour ce joker.'); return; }
    body = '<div class="fld"><span class="lab">Quelle tâche ?</span>' + radios('task', mine.map(t => [t.id, short(t)]), mine[0].id) + '</div>';
    if (kind === 'swap') {
      if (!others.length) { toast('Il faut une autre personne pour échanger.'); return; }
      body += '<div class="fld"><span class="lab">La passer à</span>' + radios('to', others.map(p => [p, pname(p), COLORS[p]]), others[0]) + '</div><p class="help">Elle ne change de responsable qu’avec l’accord de l’autre personne.</p>';
      save = f => ({kind:'swap', who: me, to: radio(f, 'to') || others[0], taskId: radio(f, 'task'), taskTitle: (byId('tasks', radio(f, 'task')) || {}).title || '', status:'pending'});
    } else {
      body += '<div class="fld"><span class="lab">Qui peut aider ?</span>' + radios('helper', [['', 'N’importe qui']].concat(others.map(p => [p, pname(p), COLORS[p]])), '') + '</div>';
      save = f => ({kind:'help', who: me, helper: '', want: radio(f, 'helper'), taskId: radio(f, 'task'), taskTitle: (byId('tasks', radio(f, 'task')) || {}).title || '', status:'open'});
    }
  }
  openSheet(JOKERS[kind], body + '<div class="sheet-actions"><button type="submit" class="btn primary">Utiliser mon joker</button></div>', async f => {
    if (jokersLeft(me, kind) < 1) { toast('Plus de joker de ce type cette semaine.'); return false; }
    const data = Object.assign(save(f), {week: wk, at: Date.now()});
    return run(() => store.set('jokers', uid(), data));
  });
}
function jokerItems(){
  const me = meOf();
  const live = state.jokers.filter(j => ['pending','open','active'].indexOf(j.status) >= 0).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  return live.map(j => {
    let txt = '', acts = '';
    if (j.kind === 'swap') {
      txt = pname(j.who) + ' passe « ' + j.taskTitle + ' » à ' + pname(j.to);
      acts = me === j.to
        ? '<button type="button" class="btn primary" data-action="jokerAccept" data-id="' + esc(j.id) + '">Accepter</button><button type="button" class="btn quiet" data-action="jokerRefuse" data-id="' + esc(j.id) + '">Refuser</button>'
        : me === j.who ? '<button type="button" class="link" data-action="jokerCancel" data-id="' + esc(j.id) + '">Annuler</button>'
        : '<span class="muted">En attente de l’accord de ' + esc(pname(j.to)) + '</span>';

        : me === j.who ? '<button type="button" class="link" data-action="jokerCancel" data-id="' + esc(j.id) + '">Annuler</button>' : '';

      txt = 'Choix de ' + pname(j.who) + ' : ' + j.what + (j.text ? ' (' + j.text + ')' : '');

const WHEEL_FILL = ['#7a5cff', '#ff6f61', '#18bfae', '#f0a500', '#3d7bff'];
let wheelRot = 0, spinning = false;
function spinState(who){
  const total = totalPts(who);
  const spun = state.spins.filter(s => s.who === who).length;
  const tickets = Math.max(0, Math.floor(total / 10) - spun);
  const usedWeek = state.spins.some(s => s.who === who && s.week === curWeek());
  return {total, tickets, usedWeek, can: tickets > 0 && !usedWeek, toNext: 10 - (total % 10)};
}
function wheelSvg(){
  const n = PRIZES.length, R = 140, C = 150, seg = 360 / n;
  const pt = a => [C + R * Math.sin(a * Math.PI / 180), C - R * Math.cos(a * Math.PI / 180)];
  let slices = '';
  PRIZES.forEach((p, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, mid = (a0 + a1) / 2, q0 = pt(a0), q1 = pt(a1);
    slices += '<path d="M' + C + ',' + C + ' L' + q0[0].toFixed(1) + ',' + q0[1].toFixed(1) + ' A' + R + ',' + R + ' 0 0 1 ' + q1[0].toFixed(1) + ',' + q1[1].toFixed(1) + ' Z" style="fill:' + WHEEL_FILL[i] + '" stroke="#fff" stroke-width="2.5"/>' +
      '<g transform="rotate(' + mid + ' ' + C + ' ' + C + ')"><g transform="translate(' + (C - 15.6) + ',' + (C - R + 14) + ') scale(1.3)" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[PRZ_ART[p.id]] + '</g>' +
      '<text text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800" style="font-family:inherit"><tspan x="' + C + '" y="' + (C - 66) + '">' + esc(p.l[0]) + '</tspan><tspan x="' + C + '" y="' + (C - 51) + '">' + esc(p.l[1]) + '</tspan></text></g>';
  });
  let bulbs = '';
  for (let i = 0; i < 20; i++) { const q = [C + 150 * Math.sin(i * 18 * Math.PI / 180), C - 150 * Math.cos(i * 18 * Math.PI / 180)]; bulbs += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.2" fill="' + (i % 2 ? '#fff' : '#ffc83d') + '"/>'; }
  return '<svg viewBox="0 0 300 300" class="wheel-svg" aria-label="Roue des récompenses"><circle cx="150" cy="150" r="148" fill="var(--brand)"/>' + bulbs +
    '<g id="wheelG" style="transform-origin:150px 150px;transform:rotate(' + wheelRot + 'deg)">' + slices + '</g><circle cx="150" cy="150" r="30" fill="#fff"/></svg>';
}
function renderWheel(){
  if (spinning) return;

  const why = st.can ? 'Un tour est disponible pour ' + pname(me) + '.' : st.usedWeek ? pname(me) + ' a déjà tourné la roue cette semaine.' : 'Pas de ticket pour l’instant : encore ' + st.toNext + ' point' + (st.toNext > 1 ? 's' : '') + ' pour le prochain.';

    '<div class="wheel-stage"><i class="wheel-ptr"></i>' + wheelSvg() + '<button type="button" class="hub" data-action="spin" aria-label="Lancer la roulette"' + (st.can ? '' : ' disabled') + '>GO</button></div>' +

    (last.length ? '<section class="card"><header class="card-h">' + IC.gift(20) + '<h2>Derniers résultats</h2></header>' + last.map(s => bcard(prizeCardData(s))).join('') + '</section>' : '');

async function doSpin(){
  const me = meOf();
  if (spinning || !state.canWrite) return;
  if (!spinState(me).can) { toast('Pas de tour disponible pour le moment.'); return; }
  spinning = true;
  const k = Math.floor(Math.random() * PRIZES.length), prize = PRIZES[k];
  const id = 's_' + me + '_' + curWeek();   // un seul tour par personne et par semaine, garanti par l'identifiant
  revealing.add(id);
  const btns = $$('[data-action=spin]'); btns.forEach(b => { b.disabled = true; });
  const ok = await run(() => store.set('spins', id, {who: me, week: curWeek(), prize: prize.id, label: prize.label, at: Date.now(), used: false}));
  if (!ok) { spinning = false; revealing.delete(id); renderAll(); return; }
  const g = $('#wheelG');
  const target = Math.ceil(wheelRot / 360) * 360 + 360 * 5 + (360 - (k * (360 / PRIZES.length) + 180 / PRIZES.length));
  if (g) {
    if (fxOn()) { g.style.transition = 'transform 4s cubic-bezier(.12,.62,.16,1)'; requestAnimationFrame(() => { g.style.transform = 'rotate(' + target + 'deg)'; }); await wait(4100); }
    else { g.style.transition = 'none'; g.style.transform = 'rotate(' + target + 'deg)'; }
  }
  wheelRot = target % 360;
  spinning = false; revealing.delete(id);
  renderAll();
  resultSheet(prize);
  confetti(); tone([[523,.12],[659,.12],[784,.12],[1046,.28]]);
}
