  const me = meOf(), lv = levelInfo(me), today = todayStr(), wk = curWeek();
  const hr = new Date().getHours(), hello = hr < 12 ? 'Bonjour' : hr < 18 ? 'Bon après-midi' : 'Bonsoir';
  const st = curStreak(me), sp = spinState(me);
  const mine = state.tasks.filter(x => x.owner === me && x.status !== 'done');
  const dueNow = mine.filter(x => (x.due && x.due <= today) || x.status === 'doing').sort(taskSort);
  const doneToday = state.points.filter(p => p.who === me && p.day === today).length;
  const tot = doneToday + dueNow.length, pct = tot ? Math.round(doneToday / tot * 100) : 0;
  const later = mine.filter(x => x.due && x.due > today).sort(taskSort).slice(0, 3);
  const evs = state.events.filter(e => e.date >= today).sort(evSort).slice(0, 2);
  const jk = Object.keys(JOKERS).reduce((s, k) => s + jokersLeft(me, k), 0);
  const waiting = visibleSpins().filter(s => s.who === me && !s.used && s.prize !== 'joker').length;
  const ppl = peopleFor(wk), t = totalsOf(wk);
  let h = '<section class="hero">' + avatar(me, 80) + '<div class="hero-t"><p class="hello">' + hello + ',</p><h1>' + esc(pname(me)) + '</h1>' +
    '<p class="pills"><span class="pill glass">Niveau ' + lv.level + ' ' + esc(lv.title) + '</span>' + (st ? '<span class="pill glass">' + IC.flame(12) + st + ' jour' + (st > 1 ? 's' : '') + '</span>' : '') + '</p></div>' +
    '<div class="hero-pts"><b>' + lv.total + '</b><span>points</span></div>' +
    '<div class="xp">' + xpBar(lv) + '<p>' + lv.into + ' / ' + lv.need + ' points vers le niveau ' + (lv.level + 1) + '</p></div></section>';

  h += '<div class="home-grid"><div>';
  h += '<section class="card"><header class="card-h">' + IC.flame(20) + '<h2>Aujourd’hui</h2><span class="muted">' + doneToday + ' terminée' + (doneToday > 1 ? 's' : '') + ' sur ' + tot + '</span></header>' +
    (tot ? '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><b style="width:' + pct + '%"></b></div>' : '') +
    (dueNow.length ? '<ul class="list">' + dueNow.slice(0, 4).map(x => taskCard(x, false)).join('') + '</ul>' + (dueNow.length > 4 ? '<p class="muted">et ' + (dueNow.length - 4) + ' autre' + (dueNow.length > 5 ? 's' : '') + '</p>' : '')
      : '<p class="muted">' + (doneToday ? 'Tout est fait pour aujourd’hui. Bravo !' : 'Rien de prévu aujourd’hui. Profites-en, ou prends une tâche « À prendre ».') + '</p>') +
    '<button type="button" class="btn" data-action="tab" data-v="tasks">Voir toutes mes tâches</button></section>';
  if (later.length || evs.length) {
    h += '<section class="card"><header class="card-h">' + ico('cal', 20) + '<h2>Prochaines échéances</h2></header>' +
      (later.length ? '<ul class="list">' + later.map(x => taskCard(x, false)).join('') + '</ul>' : '') +
      (evs.length ? '<ul class="list">' + evs.map(e => evRow(e, true)).join('') + '</ul>' : '') + '</section>';
  }
  h += '</div><div>';
  h += '<section class="card"><header class="card-h">' + IC.gift(20) + '<h2>Récompenses disponibles</h2></header><div class="tiles">' +
    '<button type="button" class="tile t-wheel" data-action="tab" data-v="wheel">' + art('ticket', 44) + '<b>' + sp.tickets + '</b><span>ticket' + (sp.tickets > 1 ? 's' : '') + ' de roulette</span></button>' +
    '<button type="button" class="tile" data-action="tab" data-v="bonus">' + art('swap', 44) + '<b>' + jk + '</b><span>joker' + (jk > 1 ? 's' : '') + '</span></button>' +
    '<button type="button" class="tile" data-action="tab" data-v="bonus">' + art('gift', 44) + '<b>' + waiting + '</b><span>bonus à utiliser</span></button></div></section>';
  h += collectiveCard();
  h += '<section class="card"><header class="card-h">' + IC.trophy(20) + '<h2>Cette semaine en famille</h2></header>' +
    '<div class="mini-lb">' + ppl.map(p => '<div style="--pc:' + COLORS[p] + '">' + avatar(p, 56) + '<b>' + t[p] + '</b><span>' + esc(pname(p)) + '</span></div>').join('') + '</div>' +
    '<button type="button" class="link" data-action="tab" data-v="family">Voir la famille et le classement</button></section>';
  h += '</div></div>';
  $('#homebody').innerHTML = h;
}

/* ===== défis ===== */
function renderChallenges(){
  $('#funbody').innerHTML = collectiveCard() + missionCard() + pactCard() + badgesCard(meOf());
}

/* ===== famille ===== */
function renderFamily(){
  const wk = curWeek(), ch = championOf(wk), sunday = new Date().getDay() === 0, ppl = peopleFor(wk), tw = totalsOf(wk);
  const cards = ppl.map(p => {
    const lv = levelInfo(p), done = state.points.filter(x => x.who === p).length, bd = badgesOf(p);
    const recent = state.points.filter(x => x.who === p).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 2);
    const jkLeft = Object.keys(JOKERS).reduce((s, k) => s + jokersLeft(p, k), 0);
    return '<article class="pcard" style="--pc:' + COLORS[p] + '">' + avatar(p, 76) + '<div class="pc-b"><h3>' + esc(pname(p)) + (sunday && ch.list.indexOf(p) >= 0 ? '<span class="trophy">' + IC.trophy(18) + '</span>' : '') + '</h3>' +
      '<p class="muted" style="margin:0">Niveau ' + lv.level + ' ' + esc(lv.title) + '</p>' + xpBar(lv) +
      '<div class="stats"><span><b>' + tw[p] + '</b> pts cette semaine</span><span><b>' + lv.total + '</b> au total</span><span><b>' + done + '</b> tâches</span><span><b>' + jkLeft + '</b> joker' + (jkLeft > 1 ? 's' : '') + '</span></div>' +
      '<div class="mini-badges">' + BADGES.map(b => '<span class="mb' + (bd[b.id] ? ' on' : '') + '" title="' + esc(b.name) + '">' + IC[b.icon](16) + '</span>').join('') + '</div>' +
      (recent.length ? '<p class="muted" style="margin:6px 0 0">Récemment : ' + recent.map(r => esc(r.title)).join(', ') + '</p>' : '') + '</div></article>';
  }).join('');
  $('#familybody').innerHTML = leaderCard() + '<div class="pgrid">' + cards + '</div>' + collectiveCard();
}

/* ===== historique ===== */
function weekRow(w){
  const pc = byId('pacts', w.id), champ = namesOf(w.champions || []);
  return '<li class="hrow"><b>' + esc(weekLabel(w.id)) + '</b>' +
    '<div class="muted">' + (champ ? 'Champion : ' + esc(champ) + ' (' + (w.max || 0) + ' pts)' : 'Pas de points cette semaine') + '</div>' +
    '<div class="muted">Défi : ' + (w.count || 0) + ' / ' + (w.goal || 20) + ((w.count || 0) >= (w.goal || 20) ? ' atteint' : '') + '</div>' +
    (pc ? '<div class="muted">Pacte : ' + esc(pc.reward) + ' <button type="button" class="link" data-action="pactDone" data-wk="' + esc(w.id) + '">' + (pc.done ? 'Réalisé ✓' : 'Marquer comme réalisé') + '</button></div>' : '') + '</li>';
}
function renderHistory(){
  const weeks = state.weeks.slice().sort((a, b) => a.id < b.id ? 1 : -1);
  const recent = state.points.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 12);
  let h = '<section class="card"><header class="card-h">' + IC.trophy(20) + '<h2>Semaines passées</h2></header>' +
    (weeks.length ? '<ul class="list">' + weeks.slice(0, histAll ? 99 : 6).map(weekRow).join('') + '</ul>' + (weeks.length > 6 ? '<button type="button" class="link" data-action="histToggle">' + (histAll ? 'Voir moins' : 'Voir tout (' + weeks.length + ')') + '</button>' : '')
      : '<p class="muted">L’historique se remplit à la fin de chaque semaine.</p>') + '</section>';
  h += '<section class="card"><header class="card-h">' + IC.star(20) + '<h2>Dernières réussites</h2></header>' +
    (recent.length ? '<ul class="list">' + recent.map(p => '<li class="feed" style="--pc:' + COLORS[p.who] + '">' + avatar(p.who, 44) + '<span class="feed-t"><b>' + esc(p.title || 'Tâche') + '</b><span class="muted">' + esc(pname(p.who)) + (p.day ? ', ' + esc(relDate(p.day)) : '') + '</span></span><span class="pill pts">' + IC.star(12) + '+' + (Number(p.pts) || 0) + '</span></li>').join('') + '</ul>'
      : '<p class="muted">Aucune tâche terminée pour l’instant.</p>') + '</section>';
  const spins = visibleSpins().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  if (spins.length) h += '<section class="card"><header class="card-h">' + IC.ticket(20) + '<h2>Résultats de la roulette</h2></header>' + spins.map(s => bcard(prizeCardData(s))).join('') + '</section>';
  $('#historybody').innerHTML = h;
}

/* ---------- événements ---------- */
const byId = (col, id) => state[col].find(x => x.id === id);
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case 'tab': if (sheet) closeSheet(); setView(el.dataset.v); break;
    case 'newTask': if (state.canWrite) taskSheet(null, el.dataset.p || ''); break;
    case 'editTask': { const t = byId('tasks', id); if (t && state.canWrite) taskSheet(t); break; }
    case 'cycle': { const t = byId('tasks', id); if (t) setStatus(t, NEXT[STATUS[t.status] ? t.status : 'todo']); break; }
    case 'assign': run(() => store.update('tasks', id, {owner: el.dataset.p, tookFromPool: true})); break;
    case 'toggleCol': ui.hiddenCols[el.dataset.p] = !ui.hiddenCols[el.dataset.p]; savePrefs(); renderTasks(); break;
    case 'statusFilter': ui.status = el.dataset.s; savePrefs(); renderTasks(); break;
    case 'toggleDone': ui.hideDone = !ui.hideDone; savePrefs(); renderTasks(); break;
    case 'settings': if (state.canWrite) settingsSheet(); else if (state.mode === 'nofamily') familySheet(); else toast('Lecture seule.'); break;
    case 'clearDue': { const f = $('#sheetForm'); if (f && f.elements.due) f.elements.due.value = ''; break; }
    case 'closeSheet': closeSheet(); break;
    case 'family': if (store.backend === 'firebase') familySheet(); break;
    case 'reload': location.reload(); break;
    case 'createFamily': { if (store.backend !== 'firebase' || getFamilyCode()) break; const c = newFamilyCode(); setFamilyCode(c); try { localStorage.setItem(NEW_FAMILY_KEY, c); } catch(e) {} location.reload(); break; }
    case 'copyCode': { const c = fmtCode(getFamilyCode()); if (navigator.clipboard) navigator.clipboard.writeText(c).then(() => toast('Code copié.'), () => toast('Copie impossible : recopie le code à la main.')); else toast('Copie impossible : recopie le code à la main.'); break; }
    case 'sheetDelete': { const s = sheet; closeSheet(); if (s && s.onDelete) s.onDelete(); break; }
    case 'undo': { const u = toast.undo; $('#toast').hidden = true; toast.undo = null; if (u) u(); break; }
    case 'calMode': ui.calMode = el.dataset.m; savePrefs(); renderCal(); break;
    case 'calPrev': case 'calNext': {
      const k = a === 'calNext' ? 1 : -1;
      if (ui.calMode === 'week') cal.anchor = addDays(cal.anchor, 7 * k);
      else cal.anchor = new Date(cal.anchor.getFullYear(), cal.anchor.getMonth() + k, 1);
      renderCal(); break;
    }
    case 'calToday': cal.anchor = new Date(); cal.sel = todayStr(); renderCal(); break;
    case 'selDay': cal.sel = el.dataset.date; renderCal(); break;
    case 'newEvent': if (state.canWrite) eventSheet(null, cal.sel); break;
    case 'editEvent': { const e = byId('events', id); if (e && state.canWrite) eventSheet(e); break; }
    case 'showPast': cal.showPast = !cal.showPast; renderCal(); break;
    case 'popClose': $('#pop').hidden = true; break;
    case 'celebrate': celebrateChampion(curWeek()); break;
    case 'pactNew': if (state.canWrite) pactSheet(el.dataset.wk); break;
    case 'pactEdit': if (state.canWrite) pactSheet(el.dataset.wk); break;
    case 'pactDone': { const pc = byId('pacts', el.dataset.wk); if (pc) run(() => store.update('pacts', pc.id, {done: !pc.done})); break; }
    case 'preset': { const f = $('#sheetForm'); if (f && f.elements.reward) { f.elements.reward.value = el.dataset.t; const r = f.querySelector('input[name=kind][value="' + el.dataset.k + '"]'); if (r) r.checked = true; } break; }
    case 'rewardPreset': { const f = $('#sheetForm'); if (f && f.elements.collReward) f.elements.collReward.value = el.dataset.t; break; }
    case 'missionDone': { const d = todayStr(), md = byId('missions', d), done = Object.assign({}, (md && md.done) || {}); done[meOf()] = missionIdx(); run(() => store.set('missions', d, {done})).then(ok => { if (ok) { pop('<div class="pts-big">Merci !</div><p class="big" style="margin:4px 0 0">La maison est un peu plus douce.</p>', 2200); tone([[660,.12],[880,.16]]); } }); break; }
    case 'missionShuffle': { const d = todayStr(); ui.missionShift[d] = (ui.missionShift[d] || 0) + 1; savePrefs(); renderAll(); break; }
    case 'badgeInfo': { const b = BADGES.filter(x => x.id === el.dataset.b)[0]; if (b) toast(b.name + ' : ' + b.desc + (badgesOf(meOf())[b.id] ? ' (obtenu)' : ' (à débloquer)')); break; }
    case 'jokerNew': { if (!state.canWrite) break; if (jokersLeft(meOf(), el.dataset.k) < 1) { toast('Plus de joker de ce type cette semaine.'); break; } jokerSheet(el.dataset.k); break; }
    case 'jokerAccept': { const j = byId('jokers', id); if (j) run(async () => { const t = byId('tasks', j.taskId); if (t && t.status !== 'done') await store.update('tasks', t.id, {owner: j.to}); await store.update('jokers', id, {status: 'accepted'}); }).then(ok => { if (ok) toast('Échange accepté.'); }); break; }
    case 'jokerRefuse': run(() => store.update('jokers', id, {status: 'refused'})); break;
    case 'jokerCancel': run(() => store.update('jokers', id, {status: 'cancelled'})); break;
    case 'helpTake': run(() => store.update('jokers', id, {status: 'accepted', helper: meOf()})).then(ok => { if (ok) { pop('<div class="pts-big">Merci !</div><p class="big" style="margin:4px 0 0">Un coup de main, c’est précieux.</p>', 2400); tone([[660,.12],[880,.16]]); } }); break;
    case 'choiceDone': run(() => store.update('jokers', id, {status: 'done'})); break;
    case 'spin': doSpin(); break;
    case 'menu': menuSheet(); break;
    case 'profile': profileSheet(); break;
    case 'setMe': ui.me = el.dataset.p; ui.meSet = true; savePrefs(); closeSheet(); renderAll(); break;
    case 'prizeUsed': run(() => store.update('spins', id, {used: true})); break;
    case 'histToggle': histAll = !histAll; renderAll(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheet) closeSheet(); });

renderAll();
store.init();
})();
</script>
</body>
</html>
