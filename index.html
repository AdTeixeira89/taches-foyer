<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<meta name="theme-color" content="#6c4cf1">
<meta name="apple-mobile-web-app-title" content="Family Play">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Family Play</title>
<style>
:root{
  --bg:#f8f9fb;--surface:#ffffff;--ink:#1d2530;--muted:#677386;--line:#e4e8ee;
  --primary:#2456c8;--on-primary:#ffffff;--tint:#eef3fd;
  --c-a:#3f8fd9;--c-b:#e0709a;--c-c:#3fa56b;--c-all:#7b8696;
  --done:#a3acb8;--late:#b4541c;--scrim:rgba(10,15,25,.4);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--surface:#1a2029;--ink:#e8ecf1;--muted:#93a0b2;--line:#2a323d;
    --primary:#7aa4ff;--on-primary:#0b1220;--tint:#1f2a40;
    --c-a:#5aa6ef;--c-b:#ee86ad;--c-c:#55bd83;--c-all:#94a0b2;
    --done:#6b7686;--late:#e0a15c;--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--surface:#1a2029;--ink:#e8ecf1;--muted:#93a0b2;--line:#2a323d;
  --primary:#7aa4ff;--on-primary:#0b1220;--tint:#1f2a40;
  --c-a:#5aa6ef;--c-b:#ee86ad;--c-c:#55bd83;--c-all:#94a0b2;
  --done:#6b7686;--late:#e0a15c;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;pointer-events:none;transform:translateY(-60px)}
.ptr svg{width:20px;height:20px;transition:transform .15s}
.ptr.go svg{color:var(--primary)}
.ptr.spin svg{animation:ptrSpin .8s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
.ptr.back{transition:transform .2s,opacity .2s}
@media (prefers-reduced-motion: reduce){.ptr.spin svg{animation:none}.ptr.back{transition:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sync{display:block;font-size:12px;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--done)}
.sync[data-m="shared"]::before{background:var(--c-c)}
.sync[data-m="local"]::before{background:var(--late)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--tint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;
  border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:550;text-align:center}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--late)}
.link{color:var(--primary);min-height:36px;padding:0 6px}

.banner{margin:0;padding:8px 14px;font-size:13px;background:var(--tint);color:var(--ink);border-bottom:1px solid var(--line)}

main{max-width:980px;margin:0 auto;padding:12px 14px 96px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-height:52px;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:550}
.tab[aria-current="page"]{color:var(--primary);box-shadow:inset 0 2px 0 var(--primary)}

/* chips */
.bar-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--primary);background:var(--tint)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--c-all));flex:none;display:inline-block}
.sep{flex:1}

/* tasks */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));margin-top:6px}
.col{padding:0 8px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.col:first-child{padding-left:0}.col:last-child{padding-right:0}
.col-h{display:flex;align-items:center;gap:6px;padding:4px 0 8px;font-weight:650}
.col-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .ct{color:var(--muted);font-weight:500;font-size:13px}
.col-h .add{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--primary);font-size:20px;line-height:1}
.col-h .add:hover{background:var(--tint)}
.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:4px;padding:3px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.st{width:34px;height:34px;flex:none;display:grid;place-items:center;margin-left:-6px}
.tt{flex:1;min-width:0;padding:7px 0;display:block}
.title{display:block;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--muted);margin-top:1px}
.tag{color:var(--primary)}
.late{color:var(--late)}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate[hidden]{display:none}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(10,20,40,.18)}
.gate-card h1{margin:0 0 8px;font-size:21px}
.gate-card input{font-size:22px;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.crow .cn{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.crow b.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;font-size:17px}
.latel{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.latel:first-of-type{border-top:0}
.latel .lt{min-width:0}.latel .lt b{display:block;overflow:hidden;text-overflow:ellipsis}
.latel .lt span{color:var(--late);font-size:13px}
.late-opts{display:grid;gap:8px;margin:4px 0 12px}
.task.done .title{color:var(--done);text-decoration:line-through}
.task.done .meta{color:var(--done)}
.assign{display:flex;gap:4px;padding-top:5px}
.dot-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--pc);color:var(--pc);font-size:12px;font-weight:650;display:grid;place-items:center;text-align:center}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.pool{margin:2px 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.pool h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}

/* champs de saisie */
@media (prefers-reduced-motion: reduce){.sheet{animation:none!important}}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-height:42px;padding:8px 11px;font-size:16px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}

/* calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg-top{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-top button{min-height:36px;padding:0 12px;color:var(--muted);text-align:center}
.seg-top button[aria-pressed="true"]{background:var(--tint);color:var(--ink);font-weight:600}
.nav{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.nav .lbl{flex:1;text-align:center;font-weight:650;text-transform:capitalize}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{min-height:52px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface)}
.day .n{font-size:13px;min-width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.out{background:transparent;color:var(--muted)}
.day.today .n{background:var(--primary);color:var(--on-primary)}
.day.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.sec-h{margin:14px 0 4px;font-size:13px;font-weight:650;color:var(--muted);text-transform:capitalize}
.ev{display:flex;gap:10px;width:100%;padding:6px 0;align-items:stretch}
.ev .bar{width:4px;border-radius:2px;background:var(--pc);flex:none}
.ev-main{min-width:0;display:block}
.ev-title{display:block;overflow-wrap:anywhere}
.upnext{margin:0 0 6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.upnext h3{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.week-day{border-top:1px solid var(--line);padding:6px 0}
.week-day:first-child{border-top:0}
.week-day .dh{font-weight:600;text-transform:capitalize}
.week-day .dh.today{color:var(--primary)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:640px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:440px;border-radius:14px;animation:none}
}
.sheet h2{margin:0 0 14px;font-size:17px}
.fld{display:block;margin-bottom:14px}
.fld>span,.fld>.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt>span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.opt input:checked+span{border-color:var(--primary);background:var(--tint)}
.opt input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .primary{flex:1}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:20px;height:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;
  display:flex;align-items:center;gap:12px;max-width:92%;padding:10px 14px;border-radius:10px;
  background:var(--ink);color:var(--bg);font-size:14px}
.toast button{color:var(--bg);font-weight:650;text-decoration:underline;min-height:28px}

@media (max-width:420px){
  main{padding:10px 10px 96px}
  .col{padding:0 5px}
  .task .title{font-size:14px}
  .btn{padding:0 12px}
}

/* jeu */
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--primary)}
.card-h h2{margin:0;font-size:15px;font-weight:650;color:var(--ink)}
.card-h .muted{margin-left:auto}
.big{font-size:16px;font-weight:600;margin:2px 0 6px;overflow-wrap:anywhere}
.lb{display:grid;grid-template-columns:auto minmax(64px,120px) 1fr auto;gap:8px;align-items:center;padding:4px 0}
.lb-n{display:inline-flex;gap:4px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trophy{color:var(--primary);display:inline-flex}
.lb-bar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.lb-bar b{display:block;height:100%;border-radius:4px;transition:width .4s}
.lb-p{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:10px;border-radius:5px;background:var(--tint);overflow:hidden;margin:6px 0}
.prog b{display:block;height:100%;background:var(--primary);border-radius:5px;transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;text-align:center;font-size:11.5px;line-height:1.2;color:var(--done);border:1px dashed var(--line)}
.badge.on{color:var(--pc);border-style:solid;border-color:var(--pc);background:var(--tint)}
.fun-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.jk:first-child{border-top:0}
.pact{margin-bottom:6px}
.chip.wrap{text-align:left;height:auto;min-height:34px;padding:6px 11px}
.pts{color:var(--muted)}
.pop{position:fixed;left:50%;top:calc(12% + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;width:min(320px,90%);padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,20,40,.22);text-align:center}
.pop.in{animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.chk{width:56px;height:56px}
.chk circle{fill:none;stroke:var(--c-c);stroke-width:3}
.chk path{fill:none;stroke:var(--c-c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pop.in .chk circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .5s .05s forwards}
.pop.in .chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .3s .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pts-big{font-size:22px;font-weight:700;color:var(--primary)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.wheel-wrap{position:relative;width:240px;height:252px;margin:0 auto 6px;padding-top:12px}
.wheel-ptr{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--ink);z-index:2}
.champ{text-align:center;padding:4px 0 12px;color:var(--primary)}
.champ p{color:var(--ink);margin:6px 0}
.champ p.muted{color:var(--muted)}
.hrow{padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
@media (prefers-reduced-motion: reduce){.pop.in,.pop.in .chk circle,.pop.in .chk path{animation:none!important;stroke-dashoffset:0}.prog b,.lb-bar b{transition:none}}

/* ===== refonte : identité visuelle jeu familial ===== */
:root{
  --bg:#f6f5fd;--surface:#ffffff;--ink:#1e1b3a;--muted:#6b6a86;--line:#e8e6f5;
  --brand:#6c4cf1;--primary:#6c4cf1;--on-primary:#ffffff;--tint:#efecff;
  --c-a:#3d7bff;--c-b:#ff6f61;--c-c:#18bfae;--c-all:#8b86a8;
  --c-d:#f2a31b;--c-e:#d64fc0;--c-f:#7fb82a;--c-g:#18a9d6;--c-h:#a9774d;
  --gold:#ffc83d;--done:#a9a6c0;--late:#d9482b;--scrim:rgba(20,15,50,.45);
  --grad:linear-gradient(135deg,#6c4cf1 0%,#3d7bff 100%);
  --shadow:0 6px 18px rgba(70,50,150,.10);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14122a;--surface:#1f1c3b;--ink:#f1efff;--muted:#a9a6cc;--line:#302c58;
    --brand:#9a85ff;--primary:#9a85ff;--on-primary:#120c2e;--tint:#2a2554;
    --c-a:#6a9bff;--c-b:#ff8a7c;--c-c:#3fd6c4;--c-all:#a29dc4;
    --c-d:#ffbe55;--c-e:#ee83d8;--c-f:#a2d84e;--c-g:#55cdf0;--c-h:#cc9f78;
    --done:#6f6a99;--late:#ff8d6e;--scrim:rgba(0,0,0,.6);
    --grad:linear-gradient(135deg,#7a5cff 0%,#3d7bff 100%);--shadow:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14122a;--surface:#1f1c3b;--ink:#f1efff;--muted:#a9a6cc;--line:#302c58;
  --brand:#9a85ff;--primary:#9a85ff;--on-primary:#120c2e;--tint:#2a2554;
  --c-a:#6a9bff;--c-b:#ff8a7c;--c-c:#3fd6c4;--c-all:#a29dc4;
    --c-d:#ffbe55;--c-e:#ee83d8;--c-f:#a2d84e;--c-g:#55cdf0;--c-h:#cc9f78;
  --done:#6f6a99;--late:#ff8d6e;--scrim:rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#7a5cff 0%,#3d7bff 100%);--shadow:0 6px 18px rgba(0,0,0,.35);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 38% at 95% 0%,rgba(108,76,241,.13),transparent 70%),radial-gradient(50% 32% at 0% 18%,rgba(24,191,174,.11),transparent 70%)}
h1,h2,h3{font-family:var(--font)}

/* en-tête */
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:0;padding:10px 14px;gap:10px;min-height:62px}
.logo{width:42px;height:42px;display:block;flex:none;filter:drop-shadow(0 4px 8px rgba(108,76,241,.35))}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.me-btn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--tint)}
.btn{min-height:46px;border-radius:16px;font-weight:700;padding:0 18px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(108,76,241,.32)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn:active{transform:translateY(1px)}
.link{color:var(--brand);font-weight:700;min-height:40px}

function mergeSettings(d){
  const n = (d && d.names) || {};
  // membres supplémentaires (facultatif : les anciens réglages n'en ont pas)
  const members = (d && Array.isArray(d.members) ? d.members : []).filter(m => m && /^m[a-z0-9]{2,16}$/.test(String(m.id))).slice(0, MAX_EXTRA).map((m, i) => ({
    id: String(m.id),
    name: String(m.name || '').trim().slice(0, 24) || 'Membre ' + (i + 1),
    avatar: /^(fox|cat|owl|bear|rabbit|panda)$/.test(m.avatar) ? m.avatar : DEFAULT_EXTRA_AVATARS[i % DEFAULT_EXTRA_AVATARS.length],
    on: m.on !== false
  }));
  const s = {
    names: {a: n.a || 'Parent 1', b: n.b || 'Parent 2', c: n.c || 'Enfant'},
    daughterOn: d && typeof d.daughterOn === 'boolean' ? d.daughterOn : true,
    goal: d && Number(d.goal) > 0 ? Number(d.goal) : 20,
    collReward: (d && d.collReward) || 'Soirée pizza',
    avatars: {a: (d && d.avatars && d.avatars.a) || 'fox', b: (d && d.avatars && d.avatars.b) || 'owl', c: (d && d.avatars && d.avatars.c) || 'rabbit'},
    members: members
  };
  members.forEach(m => { s.names[m.id] = m.name; s.avatars[m.id] = m.avatar; });
  return s;
}

let fbBase = null;
function firebaseBase(){
  if (!fbBase) fbBase = (async () => {
    const [appM, authM, fsM] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authM.signInAnonymously(auth);
    return {fsM, app, fs: fsM.initializeFirestore(app, {ignoreUndefinedProperties: true})};
  })();
  return fbBase;
}
// même interface que la base de claude.ai, rangée sous foyers/<code famille>/
async function firebaseDb(code){
  const {fsM, fs} = await firebaseBase();
  const snapDoc = s => ({id: s.id, exists: s.exists(), data: () => s.data()});
  const docApi = ref => ({
    get: async () => snapDoc(await fsM.getDoc(ref)),
    set: d => fsM.setDoc(ref, d),
    update: d => fsM.updateDoc(ref, d),
    delete: () => fsM.deleteDoc(ref),
    onSnapshot: (next, err) => fsM.onSnapshot(ref, s => next(snapDoc(s)), err)
  });
  return {
    collection: c => ({
      doc: id => docApi(fsM.doc(fs, 'foyers', code, c, id)),
      onSnapshot: (next, err) => fsM.onSnapshot(fsM.collection(fs, 'foyers', code, c), s => next({docs: s.docs.map(snapDoc)}), err)
    }),
    doc: path => docApi(fsM.doc(fs, 'foyers', code, ...path.split('/')))
  };
}

// settings/codes = {admin, codes: {a:'K7P2QX', ...}}. Tant que ce document n'existe pas (anciens foyers), chacun choisit son profil comme avant.
// Une fois les codes activés, chaque appareil entre le code d'un membre et reste relié à ce profil : impossible de passer sur un autre.
// C'est un verrouillage de confort dans l'application (la base ne distingue pas les membres), pas une sécurité forte.
const PCODE_LEN = 6;
const fmtPersonal = c => String(c || '').replace(/(.{3})(?=.)/g, '$1-');
function mergeCodes(d){
  if (!d || typeof d !== 'object') return null;
  const codes = {};
  Object.keys(d.codes || {}).forEach(k => { if (/^(a|b|c|m[a-z0-9]{2,16})$/.test(k) && /^[A-Z0-9]{6}$/.test(String(d.codes[k]))) codes[k] = String(d.codes[k]); });
  return {admin: /^(a|b|c|m[a-z0-9]{2,16})$/.test(d.admin) ? d.admin : 'a', codes};
}
function newPersonalCode(taken){
  for (;;) {
    const a = new Uint32Array(PCODE_LEN); crypto.getRandomValues(a);
    const c = Array.from(a, n => CODE_ABC[n % CODE_ABC.length]).join('');
    if (taken.indexOf(c) < 0) return c;
  }
}
const codesOf = () => (state.codes && state.codes.codes) || {};

async function ensureCodes(){
  if (ensuring || !isAdmin() || !state.canWrite || !store.db) return;
  const have = codesOf(), missing = everyone().filter(id => !have[id]);
  if (!missing.length) return;
  ensuring = true;
  try {
    const codes = Object.assign({}, have);
    missing.forEach(id => { codes[id] = newPersonalCode(Object.keys(codes).map(k => codes[k])); });
    await store.db.doc('settings/codes').set({admin: state.codes.admin, codes});
  } catch(e) { console.error(e); }
  ensuring = false;
}

/* ---------- notifications push (Firebase Cloud Messaging) ---------- */
// Chaque téléphone enregistre son jeton sous foyers/<code>/devices avec le profil choisi sur l'appareil.
// Les Cloud Functions (dossier functions/) envoient ensuite les notifications, même application fermée.
const push = {
  listening: false,
  configured(){ return store.backend === 'firebase' && !!FCM_VAPID_KEY; },
  supported(){ return this.configured() && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window; },
  on(){ try { return this.supported() && localStorage.getItem(NOTIF_KEY) === '1' && Notification.permission === 'granted'; } catch(e) { return false; } },
  deviceId(){
    let id = '';
    try { id = localStorage.getItem(DEVICE_KEY) || ''; if (!id) { id = 'd' + uid(); localStorage.setItem(DEVICE_KEY, id); } } catch(e) {}
    return id || 'd' + uid();
  },
  async messaging(){
    const {app} = await firebaseBase();
    const m = await import(FB_SDK + 'firebase-messaging.js');
    if (!(await m.isSupported())) throw new Error('Notifications non gérées par ce navigateur');
    return {m, messaging: m.getMessaging(app)};
  },
  async token(){
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const {m, messaging} = await this.messaging();
    const token = await m.getToken(messaging, {vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg});
    if (!token) throw new Error('Jeton de notification indisponible');
    if (!this.listening) {  // application ouverte : on affiche un message dans l'app (le navigateur n'en affiche pas)
      this.listening = true;
      m.onMessage(messaging, p => {  // application ouverte : message dans l'app + son (le navigateur n'en joue pas)
        const n = p.notification || {}; toast((n.title ? n.title + ' : ' : '') + (n.body || ''));
        sfx(p.data && p.data.kind === 'done' ? 'bravo' : 'ding');
      });
    }
    return token;
  },
  async save(token){
    const {fsM, fs} = await firebaseBase();
    await fsM.setDoc(fsM.doc(fs, 'foyers', getFamilyCode(), 'devices', this.deviceId()), {token, who: meOf(), updatedAt: Date.now()});
  },
  async enable(){
    if (!this.supported()) return false;
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();  // doit suivre directement un appui de l'utilisateur
    if (perm !== 'granted') { toast(perm === 'denied' ? 'Notifications bloquées : autorise-les dans les réglages du navigateur.' : 'Notifications non activées.'); return false; }
    let step = 'jeton';
    try { const token = await this.token(); step = 'enregistrement'; await this.save(token); localStorage.setItem(NOTIF_KEY, '1'); return true; }
    catch(e) {
      console.error(e);
      const code = String((e && (e.code || e.name)) || '');
      // règles Firestore pas encore publiées : le jeton est obtenu mais son enregistrement est refusé
      toast(step === 'enregistrement' && /permission/i.test(code + ' ' + ((e && e.message) || ''))
        ? 'Notifications impossibles : les règles Firebase ne sont pas encore publiées (étape « Déployer »).'
        : 'Impossible d’activer les notifications (' + step + (code ? ' : ' + code : '') + ').');
      return false;
    }
  },
  async disable(){
    try { localStorage.removeItem(NOTIF_KEY); } catch(e) {}
    try {
      const {fsM, fs} = await firebaseBase();
      await fsM.deleteDoc(fsM.doc(fs, 'foyers', getFamilyCode(), 'devices', this.deviceId()));
      const {m, messaging} = await this.messaging(); await m.deleteToken(messaging);
    } catch(e) { console.error(e); }
  },
  // au lancement : on rafraîchit le jeton (il peut changer) ; après un changement de profil : on met à jour « qui »
  async resume(){ if (this.on()) { try { await this.save(await this.token()); } catch(e) { console.error(e); } } },
  async setWho(){
    if (!this.on()) return;
    try { const {fsM, fs} = await firebaseBase(); await fsM.updateDoc(fsM.doc(fs, 'foyers', getFamilyCode(), 'devices', this.deviceId()), {who: meOf(), updatedAt: Date.now()}); }
    catch(e) { console.error(e); }
  }
};

/* ---------- stockage : base partagée (db) ou repli local ---------- */
const store = {
  db: null,
  backend: '',
  async init(){
    let db = null, created = false;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e) { db = null; }
    if (db) {
      this.db = db;
      state.mode = 'shared';
      try {
        const user = await window.claude.use('user');
        if (user) { const cw = await user.can('data.write'); if (cw === false) state.canWrite = false; }
      } catch(e) {}
      this.listen(db);
    } else if (FIREBASE_CONFIG) {
      this.backend = 'firebase';
      const code = getFamilyCode();
      if (!code) { state.mode = 'nofamily'; state.canWrite = false; renderAll(); familySheet(); return; }
      try { db = await firebaseDb(code); }
      catch(e) { console.error(e); state.mode = 'error'; state.canWrite = false; renderAll(); return; }
      this.db = db;
      state.mode = 'shared';
      this.listen(db);
      push.resume();
      if (isNewFamily(code)) {
        try { await this.seedNewFamily(); created = true; try { localStorage.removeItem(NEW_FAMILY_KEY); } catch(e) {} }
        catch(e) { console.error(e); toast('Le foyer est créé, mais les données de cet appareil n’ont pas toutes été copiées.'); }
      }
    } else {
      state.mode = 'local';
      COLS.forEach(c => { try { state[c] = JSON.parse(localStorage.getItem('famille.local.' + c) || '[]'); } catch(e) { state[c] = []; } state.loaded[c] = true; });
      try { applySettings(JSON.parse(localStorage.getItem('famille.local.settings') || 'null')); } catch(e) {}
    }
    renderAll();
    setTimeout(maybeAskProfile, 500);
    // foyer tout juste créé : on ouvre les réglages pour remplacer les prénoms de démonstration et voir les codes
    if (created) setTimeout(() => { if (!sheet && state.canWrite) settingsSheet(); }, 800);
  },
  listen(db){
    COLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        state[c] = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
        state.loaded[c] = true;
        renderAll();
      }, onDbError);
    });
    db.doc('settings/family').onSnapshot(snap => {
      applySettings(snap.exists ? snap.data() : null);
      renderAll();
    }, onDbError);
    if (this.backend === 'firebase') db.doc('settings/codes').onSnapshot(snap => {
      state.codes = snap.exists ? mergeCodes(snap.data()) : null;
      state.loaded.codes = true;
      renderAll(); refreshCodesBox();
      if (!state.codes) maybeAskProfile();
    }, onDbError);
  },
  // nouveau foyer : on y recopie ce qui avait été saisi en mode local sur cet appareil (rien n'est effacé)
  async seedNewFamily(){
    let local = null;
    try { local = JSON.parse(localStorage.getItem('famille.local.settings') || 'null'); } catch(e) {}
    await this.db.doc('settings/family').set(mergeSettings(local));
    // le créateur est l'organisateur (profil « a ») : un code personnel par profil de départ, cet appareil est relié au profil « a »
    const codes = {};
    ['a', 'b', 'c'].forEach(id => { codes[id] = newPersonalCode(Object.keys(codes).map(k => codes[k])); });
    setLock('a', codes.a);
    await this.db.doc('settings/codes').set({admin: 'a', codes});
    for (const c of COLS) {
      let rows = [];
      try { rows = JSON.parse(localStorage.getItem('famille.local.' + c) || '[]'); } catch(e) {}
      for (const r of rows) if (r && r.id) await this.db.collection(c).doc(String(r.id)).set(strip(r));
    }
  },
  localSave(c){ try { localStorage.setItem('famille.local.' + c, JSON.stringify(state[c])); } catch(e) {} },
  async set(col, id, data){
    if (this.db) return this.db.collection(col).doc(id).set(data);
    const i = state[col].findIndex(x => x.id === id);
    const obj = Object.assign({id}, data);
    if (i >= 0) state[col][i] = obj; else state[col].push(obj);
    this.localSave(col); renderAll();
  },
  async update(col, id, fields){
    if (this.db) return this.db.collection(col).doc(id).update(fields);
    const i = state[col].findIndex(x => x.id === id);
    if (i >= 0) state[col][i] = Object.assign({}, state[col][i], fields);
    this.localSave(col); renderAll();
  },
  async remove(col, id){
    if (this.db) return this.db.collection(col).doc(id).delete();
    state[col] = state[col].filter(x => x.id !== id);
    this.localSave(col); renderAll();
  },
  async saveSettings(s){
    if (this.db) return this.db.doc('settings/family').set(s);
    applySettings(s);
    try { localStorage.setItem('famille.local.settings', JSON.stringify(s)); } catch(e) {}
    renderAll();
  }
};

// `owners` (liste, facultative) quand plusieurs membres ; sinon le responsable unique `owner`. `owner` garde le premier (anciennes données).
function ownersOf(t){
  const l = Array.isArray(t.owners) && t.owners.length ? t.owners : (t.owner ? [t.owner] : []);

function withOwners(o, list){

/* ---------- rappel d'une tâche : notification à l'heure choisie (mode Firebase) ---------- */
function remindParts(ms){
  if (!(Number(ms) > 0)) return {d: '', t: ''};
  const x = new Date(Number(ms));
  return {d: ymd(x), t: pad(x.getHours()) + ':' + pad(x.getMinutes())};
}
// jour et heure saisis -> millisecondes (heure locale) ; jour seul = 9 h, heure seule = aujourd'hui
function remindFrom(dStr, tStr){
  const d = validDate(dStr) ? dStr : '', tm = /^\d{2}:\d{2}$/.test(tStr || '') ? tStr : '';
  if (!d && !tm) return 0;
  const a = (d || todayStr()).split('-').map(Number), b = (tm || '09:00').split(':').map(Number);
  return new Date(a[0], a[1] - 1, a[2], b[0], b[1]).getTime();
}
const remindLabel = ms => { const p = remindParts(ms); return relDate(p.d) + ' ' + p.t; };
const withRemind = (o, ms) => { if (ms) o.remindAt = ms; else delete o.remindAt; return o; };

function taskSort(a, b){
  const da = a.status === 'done' ? 1 : 0, db = b.status === 'done' ? 1 : 0;
  if (da !== db) return da - db;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}

  }

  if (ui.calMode === 'month') {
    const y = cal.anchor.getFullYear(), m = cal.anchor.getMonth();
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((offset + days) / 7);
    let cells = '';
    for (let i = 0; i < rows * 7; i++) {
      const d = new Date(y, m, 1 - offset + i), s = ymd(d);
      const who = Array.from(new Set(evOn(s).map(e => COLORS[e.who] ? e.who : 'all'))).slice(0, 4);

    }
    html += '<div class="nav"><button type="button" class="icon-btn" data-action="calPrev" aria-label="Mois précédent">‹</button><span class="lbl">' + esc(fmtMonth.format(first)) + '</span><button type="button" class="icon-btn" data-action="calNext" aria-label="Mois suivant">›</button><button type="button" class="link" data-action="calToday">Aujourd’hui</button></div>' +
      '<div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="grid">' + cells + '</div>';
    const sel = evOn(cal.sel);

      (sel.length ? '<ul class="list">' + sel.map(e => evRow(e, false)).join('') + '</ul>' : '<p class="empty">Aucun événement ce jour.</p>');
  } else {
    const ws = weekStart(cal.anchor), we = addDays(ws, 6);

    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), s = ymd(d), evs = evOn(s);

        (evs.length ? '<ul class="list">' + evs.map(e => evRow(e, false)).join('') + '</ul>' : '<p class="empty">Rien de prévu</p>') + '</div>';
    }
  }
  $('#calbody').innerHTML = html;
}
function groupByDate(evs){
  let out = '', cur = '';

}

/* badges : calculés à partir de l'historique des points, donc jamais retirés */
const BADGES = [
  {id:'streak3', name:'Série de 3 jours', desc:'Des points trois jours de suite.', icon:'flame'},
  {id:'perfect', name:'Semaine parfaite', desc:'Une tâche terminée chaque jour d’une même semaine.', icon:'star'},
  {id:'team', name:'Esprit d’équipe', desc:'Prendre 3 tâches « À prendre », ou donner un coup de main.', icon:'hand'},
  {id:'comeback', name:'Retour en force', desc:'3 points ou plus en un jour après 3 jours sans point.', icon:'trophy'}
];
const dayGap = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
function badgesOf(who, extra){
  const ex = extra || [];
  const all = state.points.filter(p => !ex.some(e => e.taskId && e.taskId === p.taskId)).concat(ex).filter(p => p.who === who);
  const days = Array.from(new Set(all.map(p => p.day).filter(Boolean))).sort();
  const out = {streak3:false, perfect:false, team:false, comeback:false};
  let run3 = 1;
  for (let i = 0; i < days.length; i++) {
    if (i > 0) run3 = dayGap(days[i-1], days[i]) === 1 ? run3 + 1 : 1;
    if (run3 >= 3) out.streak3 = true;
    if (i > 0 && dayGap(days[i-1], days[i]) >= 4) {
      const sum = all.filter(p => p.day === days[i]).reduce((s, p) => s + (Number(p.pts) || 0), 0);
      if (sum >= 3) out.comeback = true;
    }
  }
  const perWeek = {};
  days.forEach(d => { const k = wkOf(d); perWeek[k] = (perWeek[k] || 0) + 1; });
  out.perfect = Object.keys(perWeek).some(k => perWeek[k] >= 7);
  const helps = state.jokers.filter(j => j.kind === 'help' && j.status === 'accepted' && j.helper === who).length;
  out.team = all.filter(p => p.pool).length >= 3 || helps >= 1;
  return out;
}
function curStreak(who){
  const days = new Set(state.points.filter(p => p.who === who).map(p => p.day));
  let d = parseYmd(todayStr());
  if (!days.has(ymd(d))) d = addDays(d, -1);
  let n = 0;
  while (days.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}

let audioCtx = null;
const getAudio = () => { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) { audioCtx = null; } return audioCtx; };
// le navigateur n'autorise le son qu'après un geste : on réveille l'audio dès le premier appui

// notes de la mélodie : [fréquence, durée] (ancien format, conservé)
function tone(seq){
  if (!ui.fx.sound) return;
  let at = 0;
  playVoices(seq.map(n => { const v = {f: n[0], d: n[1], at, v: .12}; at += n[1] * .8; return v; }));
}
// une voix : f = fréquence, to = glissando vers, d = durée, at = départ (s), type = forme d'onde, v = volume, vib = vibrato (Hz)
function playVoices(voices){
  const ac = getAudio();
  if (!ac) return;
  try {
    const t0 = ac.currentTime + 0.01;
    voices.forEach(n => {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + (n.at || 0), v = n.v || .12, d = n.d || .1;
      o.type = n.type || 'sine';
      o.frequency.setValueAtTime(n.f, t);
      if (n.to) o.frequency.exponentialRampToValueAtTime(n.to, t + d);
      if (n.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = n.vib; lg.gain.value = n.f * .03; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05); }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(.02, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + d + .03);
    });
  } catch(e) {}
}

function sfx(name, force){
  if (!force && !ui.fx.sound) return;
  const v = SFX[name];
  if (v) playVoices(v);

// cliquetis de la roulette : ralentit comme la roue (sur la durée de l'animation)
function spinTicks(ms, n){
  if (!ui.fx.sound) return;
  for (let i = 1; i <= n; i++) {
    const frac = 1 - Math.pow(1 - i / n, 1 / 3);
    setTimeout(() => sfx('tick'), Math.round(frac * ms));
  }
}
function confetti(){
  if (!fxOn()) return;
  const cv = $('#fx');
  if (!cv || !cv.getContext) return;
  let ctx = null;
  try { ctx = cv.getContext('2d'); } catch(e) {}
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--c-a','--c-b','--c-c','--primary'].map(v => cs.getPropertyValue(v).trim() || '#3f8fd9').concat(['#f2c14e']);
  const ps = [];
  for (let i = 0; i < 80; i++) ps.push({x: W/2 + (Math.random()-.5)*80, y: H*.3, vx: (Math.random()-.5)*9, vy: -Math.random()*9 - 3, r: Math.random()*6.28, vr: (Math.random()-.5)*.4, s: 5 + Math.random()*5, c: cols[Math.floor(Math.random()*cols.length)]});
  const t0 = performance.now();
  function tick(now){
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / 2200); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*.6); ctx.restore();
    });
    if (el < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}

/* terminer une tâche : chaque participant reçoit ses points une seule fois (un point par personne et par tâche) */
function setStatus(t, next){
  if (next === 'done') return finishTask(t);
  sfx(next === 'doing' ? 'boing' : 'back');
  return run(() => store.update('tasks', t.id, {status: next}));
}
function finishTask(t){
  const owners = ownersOf(t).filter(o => activePeople().indexOf(o) >= 0);
  if (owners.length === 1) return completeTask(t, owners);
  askWho(t, owners);
}
// personne désignée ou plusieurs participants : on confirme qui a fait la tâche (tous les participants cochés au départ)
function askWho(t, preset){
  const opts = activePeople().map(p => [p, pname(p), COLORS[p]]);
  const several = preset && preset.length > 1;
  openSheet(several ? 'Qui a participé ?' : 'Qui l’a terminée ?',
    '<p class="help">« ' + esc(t.title) + ' »</p><div class="fld">' + checks('who', opts, preset && preset.length ? preset : [meOf()]) + '</div>' +
    '<p class="help">Chaque personne cochée reçoit les points complets, une seule fois pour cette tâche.</p>' +
    '<div class="sheet-actions"><button type="submit" class="btn primary">Terminée</button></div>',
    async f => { const who = $$('input[name="who"]:checked', f).map(i => i.value); if (!who.length) return false; closeSheet(); completeTask(t, who); return 'keep'; });
}
async function completeTask(t, whoList){
  const list = Array.from(new Set(whoList)).filter(Boolean), multi = list.length > 1;
  const wk = curWeek(), cBefore = countOf(wk), pts = ptsOf(t), day = todayStr();
  const fresh = list.filter(w => !hasPoints(t.id, w));
  // un seul participant : identifiant du point = identifiant de la tâche (comme avant) ; plusieurs : un point par personne
  const recs = fresh.map(w => ({id: multi ? t.id + '_' + w : t.id, rec: {taskId: t.id, title: t.title, who: w, pts, day, week: wkOf(day), at: Date.now(), pool: !!t.tookFromPool}}));
  const focus = fresh.indexOf(meOf()) >= 0 ? meOf() : fresh[0];
  const before = focus ? badgesOf(focus) : null;
  const lvInfo = focus ? levelInfo(focus, pts) : null, lvUp = !!focus && lvInfo.level > levelInfo(focus).level;
  const ok = await run(async () => {
    await store.set('tasks', t.id, withOwners(Object.assign(strip(t), {status: 'done', doneAt: Date.now(), doneBy: meOf()}), list));
    for (const r of recs) await store.set('points', r.id, r.rec);
  });
  if (!ok) return;
  if (!recs.length) { toast('Terminée. Les points de cette tâche étaient déjà comptés.'); return; }
  const after = badgesOf(focus, [recs.filter(r => r.rec.who === focus)[0].rec]);
  const newB = BADGES.filter(b => after[b.id] && !before[b.id]);
  const goalHit = cBefore < goalOf() && cBefore + 1 >= goalOf();
  let extra = '';
  if (lvUp) extra = 'Niveau ' + lvInfo.level + ' atteint : ' + lvInfo.title + ' !';
  else if (newB.length) extra = 'Nouveau badge : ' + newB[0].name;
  else if (goalHit) extra = 'Défi de la famille atteint !';
  const big = pts >= 3 || newB.length > 0 || goalHit || lvUp;
  popDone(pts, fresh.length > 1 ? 'Bravo ' + namesOf(fresh) + ' : ' + pts + ' point' + (pts > 1 ? 's' : '') + ' chacun !' : pick(DONE_MSGS), extra, lvInfo);
  if (big) { confetti(); sfx('big'); }
  else sfx('done');
}

/* clôture des semaines passées : historique conservé, sans doublon (id = lundi de la semaine) */
const finalizing = new Set();
function finalizeWeeks(){
  if (!state.canWrite || !state.loaded.points || !state.loaded.weeks) return;
  const cur = curWeek();
  const wks = new Set(state.points.map(p => p.week).filter(w => w && w < cur));
  wks.forEach(wk => {
    if (byId('weeks', wk) || finalizing.has(wk)) return;
    finalizing.add(wk);
    const c = championOf(wk);
    Promise.resolve(store.set('weeks', wk, {week: wk, totals: c.t, champions: c.list, max: c.max, count: countOf(wk), goal: goalOf(), closedAt: Date.now()}))
      .catch(() => finalizing.delete(wk));
  });
}

function maybeCelebrate(){
  if (['home','family','fun'].indexOf(ui.view) < 0 || sheet || !state.loaded.points) return;
  const cur = curWeek(), prev = prevWeek();

}

const jokerLive = j => j.status !== 'refused' && j.status !== 'cancelled';
function jokersLeft(who, kind){
  const wk = curWeek();
  const used = state.jokers.filter(j => j.who === who && j.week === wk && j.kind === kind && jokerLive(j)).length;
  let allow = 1;
  if (kind === 'swap') allow += state.spins.filter(s => s.who === who && s.week === wk && s.prize === 'joker').length;
  return Math.max(0, allow - used);
}

function rewardArt(text){
  const s = String(text || '').toLowerCase();
  if (/cocktail|boisson|verre/.test(s)) return 'cocktail';
  if (/pizza|repas|restau/.test(s)) return 'pizza';
  if (/film|cin[eé]/.test(s)) return 'film';
  if (/jeu|jouer|console/.test(s)) return 'game';
  if (/dessert|g[aâ]teau|glace/.test(s)) return 'dessert';
  if (/massage|soir[eé]e sans|repos/.test(s)) return 'sofa';
  if (/sortie|activit|balade/.test(s)) return 'activite';
  if (/caf[eé]/.test(s)) return 'cafe';
  return 'gift';
}

function familySheet(){
  const code = getFamilyCode();
  const body = (code
    ? '<p class="help">Code de ton foyer, à entrer sur les autres téléphones (même lien) :</p>' +
      '<p class="big" style="letter-spacing:.08em">' + esc(fmtCode(code)) + '</p>' +
      '<div class="fun-actions" style="margin-bottom:16px"><button type="button" class="btn small" data-action="copyCode">Copier le code</button></div>' +
      '<p class="help">Rejoindre un autre foyer :</p>'
    : '<p class="help">Pour que toute la famille ait les mêmes données, chacun utilise le même code de foyer. La première personne crée le foyer, les autres entrent son code.</p>') +
    '<label class="fld"><span>Code du foyer</span><input type="text" name="code" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="XXXX-XXXX-XXXX"></label>' +
    '<label class="fld"><span>Ton code personnel</span><input type="text" name="pcode" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-DEF"></label>' +
    '<p class="help">Chaque membre a son code, donné par la personne qui a créé le foyer. Ton téléphone sera relié à ton profil. Foyer sans codes : laisse vide.</p>' +
    '<p class="help" id="codeMsg" aria-live="polite"></p>' +
    '<div class="sheet-actions"><button type="submit" class="btn primary">Rejoindre</button>' +
    (code ? '' : '<button type="button" class="btn" data-action="createFamily">Créer un foyer</button>') + '</div>';
  openSheet('Foyer partagé', body, async f => {
    const c = cleanCode(val(f, 'code')), msg = $('#codeMsg');
    if (c.length !== 12) { msg.textContent = 'Le code compte 12 lettres ou chiffres.'; return 'keep'; }
    if (c === code) return true;
    msg.textContent = 'Vérification…';
    try {
      const fdb = await firebaseDb(c), s = await fdb.doc('settings/family').get();
      if (!s.exists) { msg.textContent = 'Aucun foyer ne correspond à ce code.'; return 'keep'; }
      const cs = await fdb.doc('settings/codes').get(), cd = cs.exists ? mergeCodes(cs.data()) : null, pc = cleanCode(val(f, 'pcode'));
      setFamilyCode(c);
      if (cd && pc) {
        const who = Object.keys(cd.codes).filter(k => cd.codes[k] === pc)[0];
        if (!who) { setFamilyCode(code); msg.textContent = 'Ce code personnel ne correspond à aucun membre de ce foyer.'; return 'keep'; }
        setLock(who, pc);
      } else { delete ui.lock; savePrefs(); }
    } catch(e) { console.error(e); setFamilyCode(code); msg.textContent = 'Connexion impossible. Vérifie le réseau, puis réessaie.'; return 'keep'; }
    location.reload(); return 'keep';
  });
}

];
const PRZ_ART = {film:'film', dessert:'dessert', activite:'activite', cafe:'cafe', joker:'joker'};
const WHEEL_FILL = ['#7a5cff', '#ff6f61', '#18bfae', '#f0a500', '#3d7bff'];
let wheelRot = 0, spinning = false;
function spinState(who){
  const total = totalPts(who);
  const spun = state.spins.filter(s => s.who === who).length;
  const tickets = Math.max(0, Math.floor(total / 10) - spun);
  const usedWeek = state.spins.some(s => s.who === who && s.week === curWeek());
  return {total, tickets, usedWeek, can: tickets > 0 && !usedWeek, toNext: 10 - (total % 10)};
}
function wheelSvg(){
  const n = PRIZES.length, R = 140, C = 150, seg = 360 / n;
  const pt = a => [C + R * Math.sin(a * Math.PI / 180), C - R * Math.cos(a * Math.PI / 180)];
  let slices = '';
  PRIZES.forEach((p, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, mid = (a0 + a1) / 2, q0 = pt(a0), q1 = pt(a1);
    slices += '<path d="M' + C + ',' + C + ' L' + q0[0].toFixed(1) + ',' + q0[1].toFixed(1) + ' A' + R + ',' + R + ' 0 0 1 ' + q1[0].toFixed(1) + ',' + q1[1].toFixed(1) + ' Z" style="fill:' + WHEEL_FILL[i] + '" stroke="#fff" stroke-width="2.5"/>' +
      '<g transform="rotate(' + mid + ' ' + C + ' ' + C + ')"><g transform="translate(' + (C - 15.6) + ',' + (C - R + 14) + ') scale(1.3)" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[PRZ_ART[p.id]] + '</g>' +
      '<text text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800" style="font-family:inherit"><tspan x="' + C + '" y="' + (C - 66) + '">' + esc(p.l[0]) + '</tspan><tspan x="' + C + '" y="' + (C - 51) + '">' + esc(p.l[1]) + '</tspan></text></g>';
  });
  let bulbs = '';
  for (let i = 0; i < 20; i++) { const q = [C + 150 * Math.sin(i * 18 * Math.PI / 180), C - 150 * Math.cos(i * 18 * Math.PI / 180)]; bulbs += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.2" fill="' + (i % 2 ? '#fff' : '#ffc83d') + '"/>'; }
  return '<svg viewBox="0 0 300 300" class="wheel-svg" aria-label="Roue des récompenses"><circle cx="150" cy="150" r="148" fill="var(--brand)"/>' + bulbs +
    '<g id="wheelG" style="transform-origin:150px 150px;transform:rotate(' + wheelRot + 'deg)">' + slices + '</g><circle cx="150" cy="150" r="30" fill="#fff"/></svg>';
}
function renderWheel(){
  if (spinning) return;
  const me = meOf(), st = spinState(me);
  const why = st.can ? 'Un tour est disponible pour ' + pname(me) + '.' : st.usedWeek ? pname(me) + ' a déjà tourné la roue cette semaine.' : 'Pas de ticket pour l’instant : encore ' + st.toNext + ' point' + (st.toNext > 1 ? 's' : '') + ' pour le prochain.';
  const last = visibleSpins().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 3);
  $('#wheelbody').innerHTML =
    '<section class="card wheel-card"><header class="card-h">' + IC.ticket(20) + '<h2>Roulette des récompenses</h2></header>' +
    '<div class="ticketline">' + art('ticket', 44) + '<div><p class="big" style="margin:0">' + st.tickets + ' ticket' + (st.tickets > 1 ? 's' : '') + '</p><p class="muted" style="margin:0">Un ticket tous les 10 points, un tour par semaine et par personne.</p></div></div>' +
    '<div class="wheel-stage"><i class="wheel-ptr"></i>' + wheelSvg() + '<button type="button" class="hub" data-action="spin" aria-label="Lancer la roulette"' + (st.can ? '' : ' disabled') + '>GO</button></div>' +
    '<p class="muted center" aria-live="polite">' + esc(why) + '</p>' +
    '<button type="button" class="btn primary spin" data-action="spin"' + (st.can ? '' : ' disabled') + '>Lancer la roulette</button></section>' +
    (last.length ? '<section class="card"><header class="card-h">' + IC.gift(20) + '<h2>Derniers résultats</h2></header>' + last.map(s => bcard(prizeCardData(s))).join('') + '</section>' : '');

async function doSpin(){
  const me = meOf();
  if (spinning || !state.canWrite) return;
  if (!spinState(me).can) { toast('Pas de tour disponible pour le moment.'); return; }
  spinning = true;
  const k = Math.floor(Math.random() * PRIZES.length), prize = PRIZES[k];
  const id = 's_' + me + '_' + curWeek();   // un seul tour par personne et par semaine, garanti par l'identifiant
  revealing.add(id);
  const btns = $$('[data-action=spin]'); btns.forEach(b => { b.disabled = true; });
  const ok = await run(() => store.set('spins', id, {who: me, week: curWeek(), prize: prize.id, label: prize.label, at: Date.now(), used: false}));
  if (!ok) { spinning = false; revealing.delete(id); renderAll(); return; }
  const g = $('#wheelG');
  const target = Math.ceil(wheelRot / 360) * 360 + 360 * 5 + (360 - (k * (360 / PRIZES.length) + 180 / PRIZES.length));
  if (g) {
    if (fxOn()) { spinTicks(4000, 26); g.style.transition = 'transform 4s cubic-bezier(.12,.62,.16,1)'; requestAnimationFrame(() => { g.style.transform = 'rotate(' + target + 'deg)'; }); await wait(4100); }
    else { g.style.transition = 'none'; g.style.transform = 'rotate(' + target + 'deg)'; }
  }
  wheelRot = target % 360;
  spinning = false; revealing.delete(id);
  renderAll();
  resultSheet(prize);
  confetti(); sfx(prize.id === 'joker' ? 'joker' : 'win');
}

  const recent = state.points.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 12);
  let h = '<section class="card"><header class="card-h">' + IC.trophy(20) + '<h2>Semaines passées</h2></header>' +
    (weeks.length ? '<ul class="list">' + weeks.slice(0, histAll ? 99 : 6).map(weekRow).join('') + '</ul>' + (weeks.length > 6 ? '<button type="button" class="link" data-action="histToggle">' + (histAll ? 'Voir moins' : 'Voir tout (' + weeks.length + ')') + '</button>' : '')
      : '<p class="muted">L’historique se remplit à la fin de chaque semaine.</p>') + '</section>';
  h += '<section class="card"><header class="card-h">' + IC.star(20) + '<h2>Dernières réussites</h2></header>' +
    (recent.length ? '<ul class="list">' + recent.map(p => '<li class="feed" style="--pc:' + COLORS[p.who] + '">' + avatar(p.who, 44) + '<span class="feed-t"><b>' + esc(p.title || 'Tâche') + '</b><span class="muted">' + esc(pname(p.who)) + (p.day ? ', ' + esc(relDate(p.day)) : '') + '</span></span><span class="pill pts">' + IC.star(12) + '+' + (Number(p.pts) || 0) + '</span></li>').join('') + '</ul>'
      : '<p class="muted">Aucune tâche terminée pour l’instant.</p>') + '</section>';
  const spins = visibleSpins().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  if (spins.length) h += '<section class="card"><header class="card-h">' + IC.ticket(20) + '<h2>Résultats de la roulette</h2></header>' + spins.map(s => bcard(prizeCardData(s))).join('') + '</section>';
  $('#historybody').innerHTML = h;
}

/* ---------- événements ---------- */
const byId = (col, id) => state[col].find(x => x.id === id);
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case 'tab': if (sheet) closeSheet(); setView(el.dataset.v); break;
    case 'newTask': if (state.canWrite) taskSheet(null, el.dataset.p || ''); break;
    case 'editTask': { const t = byId('tasks', id); if (t && state.canWrite) taskSheet(t); break; }
    case 'cycle': { const t = byId('tasks', id); if (t) setStatus(t, NEXT[STATUS[t.status] ? t.status : 'todo']); break; }
    case 'assign': { const t = byId('tasks', id); if (t) run(() => store.set('tasks', id, Object.assign(withOwners(strip(t), [el.dataset.p]), {tookFromPool: true, by: meOf()}))); break; }
    case 'toggleCol': ui.hiddenCols[el.dataset.p] = !ui.hiddenCols[el.dataset.p]; savePrefs(); renderTasks(); break;
    case 'statusFilter': ui.status = el.dataset.s; savePrefs(); renderTasks(); break;
    case 'toggleDone': ui.hideDone = !ui.hideDone; savePrefs(); renderTasks(); break;
    case 'settings': if (state.canWrite) settingsSheet(); else if (state.mode === 'nofamily') familySheet(); else toast('Lecture seule.'); break;
    case 'addMember': if (state.canWrite) settingsSheet(true); else if (state.mode === 'nofamily') familySheet(); else toast('Lecture seule.'); break;
    case 'addMemberRow': addMemberRow(); break;
    case 'notifOn': push.enable().then(refreshNotifBox); break;
    case 'notifOff': push.disable().then(refreshNotifBox); break;
    case 'lateAsk': { const t = byId('tasks', id); if (t && t.status !== 'done' && state.canWrite) lateSheet(t); break; }
    case 'lateDone': { const t = byId('tasks', id); closeSheet(); if (t) { const o = ownersOf(t).filter(x => activePeople().indexOf(x) >= 0); askWho(t, o.length ? o : [meOf()]); } break; }
    case 'lateSnooze': { const t = byId('tasks', id); if (t) snoozeSheet(t); break; }
    case 'clearDue': { const f = $('#sheetForm'); if (f && f.elements.due) f.elements.due.value = ''; break; }
    case 'clearRemind': { const f = $('#sheetForm'); if (f && f.elements.remindDate) { f.elements.remindDate.value = ''; f.elements.remindTime.value = ''; } break; }
    case 'closeSheet': closeSheet(); break;
    case 'family': if (store.backend === 'firebase') familySheet(); break;
    case 'reload': location.reload(); break;
    case 'createFamily': { if (store.backend !== 'firebase' || getFamilyCode()) break; const c = newFamilyCode(); setFamilyCode(c); try { localStorage.setItem(NEW_FAMILY_KEY, c); } catch(e) {} location.reload(); break; }
    case 'copyCode': { const c = fmtCode(getFamilyCode()); if (navigator.clipboard) navigator.clipboard.writeText(c).then(() => toast('Code copié.'), () => toast('Copie impossible : recopie le code à la main.')); else toast('Copie impossible : recopie le code à la main.'); break; }
    case 'sheetDelete': { const s = sheet; closeSheet(); if (s && s.onDelete) s.onDelete(); break; }
    case 'undo': { const u = toast.undo; $('#toast').hidden = true; toast.undo = null; if (u) u(); break; }
    case 'calMode': ui.calMode = el.dataset.m; savePrefs(); renderCal(); break;
    case 'calPrev': case 'calNext': {
      const k = a === 'calNext' ? 1 : -1;
      if (ui.calMode === 'week') cal.anchor = addDays(cal.anchor, 7 * k);
      else cal.anchor = new Date(cal.anchor.getFullYear(), cal.anchor.getMonth() + k, 1);
      renderCal(); break;
    }
    case 'calToday': cal.anchor = new Date(); cal.sel = todayStr(); renderCal(); break;
    case 'selDay': cal.sel = el.dataset.date; renderCal(); break;
    case 'newEvent': if (state.canWrite) eventSheet(null, cal.sel); break;
    case 'editEvent': { const e = byId('events', id); if (e && state.canWrite) eventSheet(e); break; }
    case 'showPast': cal.showPast = !cal.showPast; renderCal(); break;
    case 'popClose': $('#pop').hidden = true; break;
    case 'celebrate': celebrateChampion(curWeek()); break;
    case 'pactNew': if (state.canWrite) pactSheet(el.dataset.wk); break;
    case 'pactEdit': if (state.canWrite) pactSheet(el.dataset.wk); break;
    case 'pactDone': { const pc = byId('pacts', el.dataset.wk); if (pc) run(() => store.update('pacts', pc.id, {done: !pc.done})).then(ok => { if (ok && !pc.done) sfx('win'); }); break; }
    case 'preset': { const f = $('#sheetForm'); if (f && f.elements.reward) { f.elements.reward.value = el.dataset.t; const r = f.querySelector('input[name=kind][value="' + el.dataset.k + '"]'); if (r) r.checked = true; } break; }
    case 'rewardPreset': { const f = $('#sheetForm'); if (f && f.elements.collReward) f.elements.collReward.value = el.dataset.t; break; }
    case 'missionDone': { const d = todayStr(), md = byId('missions', d), done = Object.assign({}, (md && md.done) || {}); done[meOf()] = missionIdx(); run(() => store.set('missions', d, {done})).then(ok => { if (ok) { pop('<div class="pts-big">Merci !</div><p class="big" style="margin:4px 0 0">La maison est un peu plus douce.</p>', 2200); sfx('yay'); } }); break; }
    case 'missionShuffle': { const d = todayStr(); ui.missionShift[d] = (ui.missionShift[d] || 0) + 1; savePrefs(); renderAll(); break; }
    case 'badgeInfo': { const b = BADGES.filter(x => x.id === el.dataset.b)[0]; if (b) toast(b.name + ' : ' + b.desc + (badgesOf(meOf())[b.id] ? ' (obtenu)' : ' (à débloquer)')); break; }
    case 'jokerNew': { if (!state.canWrite) break; if (jokersLeft(meOf(), el.dataset.k) < 1) { toast('Plus de joker de ce type cette semaine.'); break; } jokerSheet(el.dataset.k); break; }
    case 'jokerAccept': { const j = byId('jokers', id); if (j) run(async () => { const t = byId('tasks', j.taskId); if (t && t.status !== 'done') await store.set('tasks', t.id, Object.assign(withOwners(strip(t), ownersOf(t).filter(o => o !== j.who).concat(j.to)), {by: meOf()})); await store.update('jokers', id, {status: 'accepted'}); }).then(ok => { if (ok) { toast('Échange accepté.'); sfx('yay'); } }); break; }
    case 'jokerRefuse': run(() => store.update('jokers', id, {status: 'refused'})); break;
    case 'jokerCancel': run(() => store.update('jokers', id, {status: 'cancelled'})); break;
    case 'helpTake': run(() => store.update('jokers', id, {status: 'accepted', helper: meOf()})).then(ok => { if (ok) { pop('<div class="pts-big">Merci !</div><p class="big" style="margin:4px 0 0">Un coup de main, c’est précieux.</p>', 2400); tone([[660,.12],[880,.16]]); } }); break;
    case 'choiceDone': run(() => store.update('jokers', id, {status: 'done'})); break;
    case 'spin': doSpin(); break;
    case 'menu': menuSheet(); break;
    case 'profile': profileSheet(); break;
    case 'soundTest': { const k = Object.keys(SFX).filter(x => ['done', 'joker', 'big', 'yay', 'win', 'boing'].indexOf(x) >= 0); soundDemo = (soundDemo + 1) % k.length; sfx(k[soundDemo], true); break; }
    case 'lockOut': delete ui.lock; ui.meSet = false; savePrefs(); closeSheet(); renderAll(); break;
    case 'leaveFamily': if (window.confirm('Quitter ce foyer sur cet appareil ? Il faudra son code pour y revenir.')) { delete ui.lock; ui.meSet = false; savePrefs(); setFamilyCode(''); location.reload(); } break;
    case 'codesOn': {
      if (!state.canWrite || state.codes) break;
      const codes = {}, adm = meOf();
      everyone().forEach(k => { codes[k] = newPersonalCode(Object.keys(codes).map(x => codes[x])); });
      const prev = ui.lock; setLock(adm, codes[adm]);
      run(() => store.db.doc('settings/codes').set({admin: adm, codes})).then(ok => { if (ok) { renderAll(); refreshCodesBox(); toast('Codes activés : donne à chacun le sien.'); } else { ui.lock = prev; if (!prev) delete ui.lock; savePrefs(); } });
      break;
    }
    case 'codeNew': {
      if (!isAdmin() || !state.canWrite || everyone().indexOf(el.dataset.p) < 0) break;
      const p = el.dataset.p, codes = Object.assign({}, codesOf());
      delete codes[p]; codes[p] = newPersonalCode(Object.keys(codes).map(x => codes[x]));
      const old = ui.lock.c, mine = p === ui.lock.who;
      if (mine) { ui.lock.c = codes[p]; savePrefs(); }
      run(() => store.db.doc('settings/codes').set({admin: state.codes.admin, codes})).then(ok => { if (ok) toast('Nouveau code pour ' + pname(p) + '. L’ancien ne fonctionne plus.'); else if (mine) { ui.lock.c = old; savePrefs(); } });
      break;
    }
    case 'setMe': if (lockOk()) break; ui.me = el.dataset.p; ui.meSet = true; savePrefs(); closeSheet(); renderAll(); push.setWho(); break;
    case 'prizeUsed': run(() => store.update('spins', id, {used: true})); break;
    case 'histToggle': histAll = !histAll; renderAll(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheet) closeSheet(); });
document.addEventListener('submit', ev => { if (ev.target && ev.target.id === 'gateForm') gateSubmit(ev); });

/* ---------- actualiser en tirant vers le bas (téléphone) ---------- */
(function pullToRefresh(){
  const el = $('#ptr'), PULL = 64, MAX = 110;
  if (!el || !('ontouchstart' in window)) return;
  let y0 = 0, x0 = 0, dy = 0, on = false, busy = false;
  const free = t => !sheet && $('#pop').hidden && !(t && t.closest && t.closest('input,textarea,select,[contenteditable],.sheet')) && (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  const show = d => {
    const p = Math.min(1, d / PULL);
    el.classList.remove('back'); el.style.opacity = String(Math.min(1, p * 1.2));
    el.style.transform = 'translateY(' + (Math.min(d, MAX) - 52) + 'px)';
    el.firstElementChild.style.transform = 'rotate(' + Math.round(p * 270) + 'deg)';
    el.classList.toggle('go', d >= PULL);
  };
  const hide = () => { el.classList.add('back'); el.style.opacity = '0'; el.style.transform = 'translateY(-60px)'; el.classList.remove('go', 'spin'); };
  document.addEventListener('touchstart', ev => {
    on = false; dy = 0;
    if (busy || ev.touches.length !== 1 || !free(ev.target)) return;
    y0 = ev.touches[0].clientY; x0 = ev.touches[0].clientX; on = true;
  }, {passive: true});
  document.addEventListener('touchmove', ev => {
    if (!on) return;
    const t = ev.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (my <= 0 || Math.abs(mx) > my || !free(ev.target)) { if (dy) hide(); on = false; dy = 0; return; }
    dy = my * .55; show(dy);
  }, {passive: true});
  document.addEventListener('touchend', () => {
    if (!on) return;
    const ok = dy >= PULL; on = false; dy = 0;
    if (!ok) { hide(); return; }
    busy = true; el.classList.add('spin'); el.style.opacity = '1'; el.style.transform = 'translateY(' + (PULL - 52) + 'px)';
    setTimeout(() => location.reload(), fxOn() ? 250 : 0);
  }, {passive: true});
  document.addEventListener('touchcancel', () => { if (on) { on = false; dy = 0; hide(); } }, {passive: true});
})();

renderAll();
store.init();
})();
</script>
